<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1260" font-family="Jost, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201A13"/>
      <stop offset="0.5" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#120F0C"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.85" cy="0" r="0.8">
      <stop offset="0" stop-color="#C9963C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C9963C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.08" cy="1" r="0.8">
      <stop offset="0" stop-color="#C9963C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C9963C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9963C" stop-opacity="0.16"/>
      <stop offset="0.75" stop-color="#C9963C" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#C9963C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D9A8"/>
      <stop offset="0.55" stop-color="#C9963C"/>
      <stop offset="1" stop-color="#A87A2C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9963C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9963C"/>
      <stop offset="1" stop-color="#C9963C" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8.5 5 L 0 9 Z" fill="#C9963C"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="1260" rx="28" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="1260" rx="28" fill="url(#glowTop)"/>
  <rect x="0" y="0" width="1400" height="1260" rx="28" fill="url(#glowBottom)"/>
  <rect x="24" y="24" width="1352" height="1212" rx="18" fill="none" stroke="#C9963C" stroke-opacity="0.22" stroke-width="1"/>
  <!-- corner accents -->
  <path d="M 24 60 L 24 42 Q 24 24 42 24 L 60 24" fill="none" stroke="#C9963C" stroke-width="2.5"/>
  <path d="M 1376 1200 L 1376 1218 Q 1376 1236 1358 1236 L 1340 1236" fill="none" stroke="#C9963C" stroke-width="2.5"/>

  <!-- title -->
  <text x="700" y="86" text-anchor="middle" font-size="15" letter-spacing="7" fill="#C9963C" font-weight="600">ALLTAGSENGEL · EFY CARE</text>
  <text x="700" y="140" text-anchor="middle" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-size="46" font-weight="600" fill="#F7F2EA">Der automatisierte Verordnungs-Kreislauf</text>
  <text x="700" y="176" text-anchor="middle" font-size="17" font-weight="300" fill="#F7F2EA" opacity="0.62">Vom Rezept bis zur Zahlung — ohne Papier, ohne Drittanbieter, ohne Medienbruch.</text>
  <rect x="580" y="198" width="240" height="1.5" fill="url(#goldLine)"/>

  <!-- ring glow -->
  <circle cx="700" cy="680" r="430" fill="url(#centerGlow)"/>
  <circle cx="700" cy="680" r="330" fill="none" stroke="#C9963C" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 7"/>

  <!-- ===== connecting arcs (R=330, center 700,680) ===== -->
  <g fill="none" stroke="#C9963C" stroke-width="2.2" stroke-opacity="0.85">
    <path d="M 774.2 358.4 A 330 330 0 0 1 874.9 400.2" marker-end="url(#arrow)"/>
    <path d="M 979.9 505.1 A 330 330 0 0 1 1021.5 605.7" marker-end="url(#arrow)"/>
    <path d="M 1021.5 754.3 A 330 330 0 0 1 979.9 854.9" marker-end="url(#arrow)"/>
    <path d="M 874.9 959.8 A 330 330 0 0 1 774.2 1001.6" marker-end="url(#arrow)"/>
    <path d="M 625.8 1001.6 A 330 330 0 0 1 525.1 959.8" marker-end="url(#arrow)"/>
    <path d="M 420.1 854.9 A 330 330 0 0 1 378.5 754.3" marker-end="url(#arrow)"/>
    <path d="M 378.5 605.7 A 330 330 0 0 1 420.1 505.1" marker-end="url(#arrow)"/>
    <path d="M 525.1 400.2 A 330 330 0 0 1 625.8 358.4" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== center ===== -->
  <circle cx="700" cy="680" r="150" fill="#1E1913" stroke="#C9963C" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="700" cy="680" r="141" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
  <image x="646" y="576" width="108" height="108" href="data:image/png;base64,__LOGO_B64__"/>
  <text x="700" y="722" text-anchor="middle" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-size="31" font-weight="600" fill="#F7F2EA">Alltagsengel</text>
  <text x="700" y="752" text-anchor="middle" font-size="12.5" letter-spacing="3.5" font-weight="500" fill="#C9963C">EINE PLATTFORM</text>
  <text x="700" y="774" text-anchor="middle" font-size="12.5" font-weight="300" fill="#F7F2EA" opacity="0.55">Eigenes Abrechnungssystem</text>

  <!-- ===== step template pieces are drawn per node ===== -->
  <!-- node style: glass circle r=56, gold ring, badge number, icon, label outside -->

  <!-- STEP 1 · top (700,350) · Arzt stellt Verordnung -->
  <g>
    <circle cx="700" cy="350" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="700" cy="350" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="741" cy="311" r="14" fill="url(#goldGrad)"/>
    <text x="741" y="316" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">1</text>
    <!-- icon: prescription document -->
    <g transform="translate(700 350)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -13 -21 L 7 -21 L 15 -13 L 15 21 L -13 21 Z"/>
      <path d="M 7 -21 L 7 -13 L 15 -13"/>
      <path d="M -6 -3 L 2 -3 M -2 -7 L -2 1"/>
      <path d="M -6 8 L 8 8 M -6 14 L 4 14"/>
    </g>
    <text x="700" y="258" text-anchor="middle" font-size="18.5" font-weight="500" fill="#F7F2EA">Arzt stellt Verordnung</text>
    <text x="700" y="281" text-anchor="middle" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Häusliche Krankenpflege · §37 SGB V</text>
  </g>

  <!-- STEP 2 · (933,447) · System erfasst -->
  <g>
    <circle cx="933" cy="447" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="933" cy="447" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="974" cy="408" r="14" fill="url(#goldGrad)"/>
    <text x="974" y="413" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">2</text>
    <!-- icon: scan frame + doc -->
    <g transform="translate(933 447)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -20 -12 L -20 -20 L -12 -20 M 12 -20 L 20 -20 L 20 -12"/>
      <path d="M -20 12 L -20 20 L -12 20 M 12 20 L 20 20 L 20 12"/>
      <path d="M -24 0 L 24 0" stroke="#C9963C"/>
      <path d="M -9 -9 L 9 -9 M -9 9 L 9 9" stroke-opacity="0.8"/>
    </g>
    <text x="1030" y="418" text-anchor="start" font-size="18.5" font-weight="500" fill="#F7F2EA">System erfasst digital</text>
    <text x="1030" y="441" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Scan, Prüfung &amp; Stammdaten</text>
    <text x="1030" y="459" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">in Sekunden statt Tagen</text>
  </g>

  <!-- STEP 3 · (1030,680) · Kassengenehmigung -->
  <g>
    <circle cx="1030" cy="680" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="1030" cy="680" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="1071" cy="641" r="14" fill="url(#goldGrad)"/>
    <text x="1071" y="646" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">3</text>
    <!-- icon: shield check -->
    <g transform="translate(1030 680)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -22 L 17 -15 L 17 2 Q 17 15 0 22 Q -17 15 -17 2 L -17 -15 Z"/>
      <path d="M -7 0 L -2 6 L 8 -7" stroke="#C9963C"/>
    </g>
    <text x="1128" y="668" text-anchor="start" font-size="18.5" font-weight="500" fill="#F7F2EA">Kassengenehmigung</text>
    <text x="1128" y="691" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Digitale Einreichung &amp;</text>
    <text x="1128" y="709" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Status-Tracking in Echtzeit</text>
  </g>

  <!-- STEP 4 · (933,913) · Pflegekraft verplant -->
  <g>
    <circle cx="933" cy="913" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="933" cy="913" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="974" cy="874" r="14" fill="url(#goldGrad)"/>
    <text x="974" y="879" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">4</text>
    <!-- icon: calendar -->
    <g transform="translate(933 913)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-18" y="-15" width="36" height="33" rx="4"/>
      <path d="M -18 -6 L 18 -6"/>
      <path d="M -9 -21 L -9 -12 M 9 -21 L 9 -12"/>
      <path d="M -9 3 L -4 3 M 3 3 L 8 3 M -9 11 L -4 11" stroke="#C9963C"/>
    </g>
    <text x="1030" y="905" text-anchor="start" font-size="18.5" font-weight="500" fill="#F7F2EA">Pflegekraft verplant</text>
    <text x="1030" y="928" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Tourenplanung per App —</text>
    <text x="1030" y="946" text-anchor="start" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">qualifikationsgenau &amp; effizient</text>
  </g>

  <!-- STEP 5 · bottom (700,1010) · Leistung erbracht -->
  <g>
    <circle cx="700" cy="1010" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="700" cy="1010" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="741" cy="971" r="14" fill="url(#goldGrad)"/>
    <text x="741" y="976" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">5</text>
    <!-- icon: heart -->
    <g transform="translate(700 1010)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 16 C -22 2 -20 -14 -10 -16 C -4 -17.5 0 -13 0 -9 C 0 -13 4 -17.5 10 -16 C 20 -14 22 2 0 16 Z"/>
      <path d="M -14 -2 L -6 -2 L -3 -7 L 2 4 L 5 -2 L 14 -2" stroke="#C9963C" stroke-width="2.2"/>
    </g>
    <text x="700" y="1105" text-anchor="middle" font-size="18.5" font-weight="500" fill="#F7F2EA">Leistung erbracht</text>
    <text x="700" y="1128" text-anchor="middle" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Beim Klienten vor Ort · mobil dokumentiert</text>
  </g>

  <!-- STEP 6 · (467,913) · Leistungsnachweis -->
  <g>
    <circle cx="467" cy="913" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="467" cy="913" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="508" cy="874" r="14" fill="url(#goldGrad)"/>
    <text x="508" y="879" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">6</text>
    <!-- icon: clipboard + signature -->
    <g transform="translate(467 913)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-15" y="-18" width="30" height="37" rx="4"/>
      <path d="M -6 -18 L -6 -22 L 6 -22 L 6 -18"/>
      <path d="M -8 -6 L 8 -6 M -8 1 L 5 1"/>
      <path d="M -8 11 C -4 6 -1 14 3 9 L 8 9" stroke="#C9963C" stroke-width="2.2"/>
    </g>
    <text x="370" y="905" text-anchor="end" font-size="18.5" font-weight="500" fill="#F7F2EA">Leistungsnachweis</text>
    <text x="370" y="928" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Digitale Unterschrift —</text>
    <text x="370" y="946" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">lückenlos &amp; revisionssicher</text>
  </g>

  <!-- STEP 7 · (370,680) · Automatische Abrechnung -->
  <g>
    <circle cx="370" cy="680" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="370" cy="680" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="411" cy="641" r="14" fill="url(#goldGrad)"/>
    <text x="411" y="646" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">7</text>
    <!-- icon: invoice with € -->
    <g transform="translate(370 680)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -13 -21 L 13 -21 L 13 21 L 8 17 L 3 21 L -2 17 L -7 21 L -13 17 Z"/>
      <text x="0" y="4" text-anchor="middle" font-size="19" font-weight="600" fill="#C9963C" stroke="none" font-family="'DejaVu Sans', Jost, sans-serif">€</text>
      <path d="M -7 10 L 7 10" stroke-opacity="0.8"/>
    </g>
    <text x="272" y="662" text-anchor="end" font-size="18.5" font-weight="500" fill="#F7F2EA">Automatische</text>
    <text x="272" y="686" text-anchor="end" font-size="18.5" font-weight="500" fill="#F7F2EA">Abrechnung</text>
    <text x="272" y="709" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">KI prüft — eigenes System</text>
    <text x="272" y="727" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">rechnet direkt mit der Kasse ab</text>
  </g>

  <!-- STEP 8 · (467,447) · Zahlung -->
  <g>
    <circle cx="467" cy="447" r="56" fill="#221C15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="467" cy="447" r="49" fill="none" stroke="#C9963C" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="508" cy="408" r="14" fill="url(#goldGrad)"/>
    <text x="508" y="413" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A1612">8</text>
    <!-- icon: coin + arrow in -->
    <g transform="translate(467 447)" fill="none" stroke="#E3BE7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3" cy="2" r="16"/>
      <text x="3" y="9" text-anchor="middle" font-size="18" font-weight="600" fill="#C9963C" stroke="none" font-family="'DejaVu Sans', Jost, sans-serif">€</text>
      <path d="M -22 -16 L -13 -7 M -13 -13.5 L -13 -7 L -19.5 -7" stroke="#C9963C" stroke-width="2.2"/>
    </g>
    <text x="370" y="418" text-anchor="end" font-size="18.5" font-weight="500" fill="#F7F2EA">Zahlung</text>
    <text x="370" y="441" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">Schneller Zahlungseingang —</text>
    <text x="370" y="459" text-anchor="end" font-size="13" font-weight="300" fill="#F7F2EA" opacity="0.55">planbare Liquidität</text>
  </g>

  <!-- footer -->
  <rect x="440" y="1168" width="520" height="1.5" fill="url(#goldLine)"/>
  <text x="700" y="1204" text-anchor="middle" font-size="13.5" font-weight="300" fill="#F7F2EA" opacity="0.6">Ein geschlossener Kreislauf — jede Verordnung wird automatisch zur Zahlung.</text>
  <text x="700" y="1226" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="500" fill="#C9963C">INFO@ALLTAGSENGEL.CARE · FRANKFURT AM MAIN</text>
</svg>
