# CI — Pflichtprüfungen vor jedem Merge.
#
# Deployment läuft weiterhin über Vercel (nicht Teil dieser Pipeline).
# Diese Pipeline ist ein reines Qualitäts-Gate: sie deployt nichts,
# sie verifiziert nur, dass main/PR-Branches den Mindeststandard halten.
#
# Siehe audit/CI_CD_PIPELINE.md für Details zu jedem Schritt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Platzhalter-Werte für den Production-Build. Next.js liest diese ENVs
  # nur lazy zur Laufzeit von Route-Handlern/Server-Components — keine
  # der statisch generierten Seiten (generateStaticParams) macht zur
  # Build-Zeit einen echten Supabase-Call. Reale Secrets gehören NICHT
  # in dieses Workflow-File, sondern (falls für einen späteren
  # Deploy-Schritt nötig) in Repository/Environment Secrets.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    # Laeuft normal in ~5-6 Min. Ohne explizites Limit greift GitHubs
    # Default von 6 Stunden — ein haengender Schritt blockiert dann den
    # ganzen Run, statt schnell rot zu werden.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (informativ — blockiert nicht)
        # ~1.100 bestehende no-explicit-any-Fehler, v. a. weil es keine
        # generierten Supabase-DB-Typen gibt (kein `supabase gen types`
        # im Workflow). Ein Voll-Fix ist riskant für den Vercel-Build
        # (siehe Projekt-Memory) und nicht Teil dieses Branches — Lint
        # bleibt sichtbar, blockiert Merges aber bewusst nicht, bis das
        # geklärt ist. Neue Lint-Fehler in eigenen PRs sollten trotzdem
        # im Log auffallen und im Review angesprochen werden.
        run: npm run lint || true

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Unit tests (node:test)
        run: npm run test:unit

      - name: Secret scan
        run: bash scripts/ci-secret-scan.sh

      - name: IK-Hardcoding-Check
        run: bash scripts/ci-ik-check.sh

      - name: Forbidden-strings lint
        run: npm run lint:forbidden

      - name: Production build
        env:
          # Next.js Production-Builds dieses Repos sind speicherhungrig
          # (großer PLZ-Datensatz, viele statische Städte-Seiten). Default-
          # V8-Heap reicht knapp nicht — mit mehr Headroom auf GH-Runnern.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

  e2e:
    name: E2E — PflegeCoach-Produktbereich (DiPA-Matrix QS-05)
    runs-on: ubuntu-latest
    # Laeuft normal in ~4-5 Min (erfolgreiche Runs am 14.08.: 4m32s,
    # 4m21s, 5m02s). 25 Min lassen reichlich Luft und beenden einen
    # Haenger zeitnah — Run 31796623330 stand 29m33s im Browser-Install.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright browsers
        # Nur chromium + webkit — genau die zwei Projekte aus
        # playwright.config.ts (chromium, mobile-safari/iPhone 14).
        # Firefox wurde bisher unnoetig mitinstalliert.
        timeout-minutes: 10
        run: npm run test:e2e:install

      - name: Production build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Start server
        # Placeholder-Supabase-URL genügt: die getestete Suite läuft
        # ausdrücklich ohne Anmeldung (siehe Kommentar in
        # e2e/pflegecoach.spec.ts). requireCoachSession() behandelt jeden
        # Fehler von supabase.auth.getUser() — auch eine nicht auflösbare
        # Placeholder-Domain — als „nicht angemeldet" (401), fail-closed
        # nach lib/coach/api-auth.ts.
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/pflegecoach/start -o /dev/null && exit 0
            sleep 1
          done
          echo "Server kam nach 60s nicht hoch." >&2
          exit 1

      - name: Run E2E suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        # pflegecoach-axe.spec.ts (DiPA-Matrix BF-03) laeuft mit: axe-core
        # WCAG 2.1 A/AA plus ein eigener Kontrastrechner. Letzterer existiert,
        # weil axe den am 14.08.2026 gefundenen 1:1-Kontrast des primaeren
        # Link-Buttons nur als "incomplete" meldete, nicht als Verstoss.
        run: npx playwright test e2e/pflegecoach.spec.ts e2e/pflegecoach-axe.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
