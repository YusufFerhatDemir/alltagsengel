# CI — Pflichtprüfungen vor jedem Merge.
#
# Deployment läuft weiterhin über Vercel (nicht Teil dieser Pipeline).
# Diese Pipeline ist ein reines Qualitäts-Gate: sie deployt nichts,
# sie verifiziert nur, dass main/PR-Branches den Mindeststandard halten.
#
# Siehe audit/CI_CD_PIPELINE.md für Details zu jedem Schritt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Platzhalter-Werte für den Production-Build. Next.js liest diese ENVs
  # nur lazy zur Laufzeit von Route-Handlern/Server-Components — keine
  # der statisch generierten Seiten (generateStaticParams) macht zur
  # Build-Zeit einen echten Supabase-Call. Reale Secrets gehören NICHT
  # in dieses Workflow-File, sondern (falls für einen späteren
  # Deploy-Schritt nötig) in Repository/Environment Secrets.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    # Laeuft normal in ~5-6 Min. Ohne explizites Limit greift GitHubs
    # Default von 6 Stunden — ein haengender Schritt blockiert dann den
    # ganzen Run, statt schnell rot zu werden.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (informativ — blockiert nicht)
        # ~1.100 bestehende no-explicit-any-Fehler, v. a. weil es keine
        # generierten Supabase-DB-Typen gibt (kein `supabase gen types`
        # im Workflow). Ein Voll-Fix ist riskant für den Vercel-Build
        # (siehe Projekt-Memory) und nicht Teil dieses Branches — Lint
        # bleibt sichtbar, blockiert Merges aber bewusst nicht, bis das
        # geklärt ist. Neue Lint-Fehler in eigenen PRs sollten trotzdem
        # im Log auffallen und im Review angesprochen werden.
        run: npm run lint || true

      - name: Unit tests (vitest)
        env:
          SHADOW_SUPABASE_URL: ${{ secrets.SHADOW_SUPABASE_URL }}
          SHADOW_SUPABASE_ANON_KEY: ${{ secrets.SHADOW_SUPABASE_ANON_KEY }}
          SHADOW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHADOW_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run

      - name: Unit tests (node:test)
        run: npm run test:unit

      - name: Secret scan
        run: bash scripts/ci-secret-scan.sh

      - name: IK-Hardcoding-Check
        run: bash scripts/ci-ik-check.sh

      - name: Forbidden-strings lint
        run: npm run lint:forbidden

      - name: Mandanten-Lint (organization_id bei Dienstschluessel-Inserts)
        # 190 Tabellen tragen live `organization_id NOT NULL DEFAULT
        # current_org_id()`. Diese Funktion liest auth.uid(); beim
        # Dienstschluessel gibt es keinen angemeldeten Nutzer, die
        # Fallback-Kette laeuft ins Leere und endet in einer fest
        # verdrahteten Stamm-Organisation. Ein Insert ohne organization_id
        # legt die Zeile deshalb beim FALSCHEN Mandanten ab — und der eigene
        # sieht sie hinter dem RESTRICTIVE org_fence gar nicht mehr.
        #
        # Die Regel liest scripts/org-default-tables.json (eingecheckt,
        # aus der Live-DB erzeugt) und braucht deshalb keinen DB-Zugang.
        run: npm run lint:org-id

      - name: Lint — Rollenquelle und PostgREST-Filter in API-Routen
        # Track 7 (28.08.2026). ZWEI REGELN:
        #
        # R1: Es gibt ZWEI nicht selbst beschreibbare Rollenquellen
        #     (profiles.role und app_metadata.role). Die Entscheidungsregel
        #     in lib/auth/rollen.ts ist die Schnittmenge: profiles bindend,
        #     app_metadata nur einschraenkend. 49 API-Routen — praktisch der
        #     gesamte Geldweg — haben ihre Rolle stattdessen selbst aus
        #     profiles gelesen; eine Herabstufung, die nur im Token steht,
        #     blieb dort wirkungslos.
        #
        # R2: `.or(…)` nimmt eine ZEICHENKETTE, in der PostgREST seine
        #     eigene Filtergrammatik liest. Ein roher Suchbegriff darin
        #     laesst den Suchenden Bedingungen ueber beliebige Spalten
        #     anhaengen (Befund: KIM-Adressbuch).
        #
        # Beide Regeln laufen rein statisch und brauchen keinen DB-Zugang.
        run: npm run lint:route-auth

      - name: Schema-Drift-Check (warn-only — blockiert nicht)
        # Findet Code, der Spalten anspricht, die es live nicht gibt.
        # PostgREST lehnt so eine Abfrage komplett ab (42703); im Code sieht
        # das aus wie „keine Daten". TypeScript und Unit-Tests sehen das nicht.
        #
        # Der Check braucht ein echtes PostgREST (OpenAPI-Beschreibung unter
        # /rest/v1/). Die Shadow-DB ist ein lokales Postgres ohne API-Schicht
        # und taugt dafür nicht — deshalb laufen hier Repo-Secrets:
        #   SCHEMA_DRIFT_SUPABASE_URL         (Projekt-URL)
        #   SCHEMA_DRIFT_SUPABASE_SECRET_KEY  (sb_secret_… oder service_role)
        # Sind sie nicht gesetzt, meldet der Check laut ÜBERSPRUNGEN und endet
        # mit 0 — er tut NICHT so, als hätte er geprüft.
        #
        # warn-only, weil Schema-Drift P2 ist: sichtbar im Log, aber kein
        # Merge-Blocker. Die Platzhalter-ENVs am Workflow-Kopf werden hier
        # bewusst leer überschrieben, sonst liefe der Check gegen eine
        # nicht auflösbare Domain.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SCHEMA_DRIFT_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SCHEMA_DRIFT_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
        run: node scripts/schema-drift-check.mjs --warn-only

      - name: RLS-Sichtbarkeit — keine NEUE blinde Seite/Rolle-Kombination
        # Findet Admin-Seiten, die fuer eine Rolle freigegeben sind, ihr unter
        # RLS aber NICHTS liefern. Das ist kein Leck (zu wenig statt zu viel),
        # aber eine stille Falschaussage: die Seite oeffnet sich und bleibt
        # leer, ohne zu sagen warum. Genau so entstand die QM/PDL-Luecke.
        #
        # WARUM MIT OBERGRENZE STATT --strict
        # Am 31.08.2026 standen 51 solcher Paare offen (52 minus den einen
        # Fehlbefund /admin/sepa → documents: das war der SPEICHER-Eimer,
        # nicht die Tabelle). Jedes zu schliessen
        # heisst, je Tabelle zu entscheiden, welche Rolle sie sehen darf —
        # eine Sicherheitsentscheidung, keine Sammelaktion. Ein harter
        # Blocker waere binnen einer Woche mit `|| true` entschaerft worden,
        # und dann prueft die CI wieder nichts. Die Obergrenze laesst den
        # Bestand durch und bricht bei jedem NEUEN Paar.
        #
        # Wer eines schliesst, senkt die Zahl hier. Der Lauf sagt es selbst,
        # sobald er weniger findet als erlaubt.
        #
        # Braucht dieselben Repo-Secrets wie der Schema-Drift-Check; fehlen
        # sie, endet das Skript mit einer Meldung statt mit falschem Gruen.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SCHEMA_DRIFT_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SCHEMA_DRIFT_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
        run: npm run lint:rls-sicht -- --hoechstens 51

      - name: Production build
        env:
          # Next.js Production-Builds dieses Repos sind speicherhungrig
          # (großer PLZ-Datensatz, viele statische Städte-Seiten). Default-
          # V8-Heap reicht knapp nicht — mit mehr Headroom auf GH-Runnern.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

  e2e:
    name: E2E — vollstaendige Playwright-Suite (e2e/)
    runs-on: ubuntu-latest
    # Laeuft normal in ~4-5 Min (erfolgreiche Runs am 14.08.: 4m32s,
    # 4m21s, 5m02s). Das Job-Limit muss den Worst Case der Install-Schritte
    # unten mit abdecken (apt bis 20 Min + Retries), sonst killt es den Job
    # bevor deren eigene, engere Limits greifen. Die Schritt-Limits sind
    # die eigentliche Haenger-Bremse, nicht dieses hier.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          # Nur die Browser-Binaries. Der apt-Teil (Schritt darunter) laesst
          # sich so nicht cachen und laeuft weiterhin bei jedem Run.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps (apt)
        # Aufgeteilt aus dem frueheren `playwright install --with-deps`:
        # der apt-Teil zieht fuer webkit den kompletten GStreamer-/SDL-Stack
        # (~130 Pakete). Am 19.08.2026 war azure.archive.ubuntu.com in vier
        # Runs (32242056376, 32244981928, 32246997205, 32250060264) so
        # langsam, dass die damalige 10-Min-Grenze riss, waehrend apt noch
        # Fortschritt machte — normal dauert der Schritt 40-100s. Getrennt +
        # drei Versuche + 20-Min-Deckel: ein zaeher Mirror kostet jetzt Zeit
        # statt den ganzen Run, und ein langsames apt reisst nicht mehr den
        # Browser-Download mit.
        timeout-minutes: 20
        run: |
          for versuch in 1 2 3; do
            if npm run test:e2e:install:deps; then exit 0; fi
            echo "apt-Versuch $versuch fehlgeschlagen — Retry in 15s." >&2
            sleep 15
          done
          echo "playwright install-deps nach 3 Versuchen fehlgeschlagen." >&2
          exit 1

      - name: Install Playwright browsers
        # Nur chromium + webkit — genau die zwei Projekte aus
        # playwright.config.ts (chromium, mobile-safari/iPhone 14).
        # Firefox wurde bisher unnoetig mitinstalliert.
        # Bei Cache-Treffer praktisch ein No-Op.
        timeout-minutes: 10
        run: |
          for versuch in 1 2 3; do
            if npm run test:e2e:install:browsers; then exit 0; fi
            echo "Browser-Download Versuch $versuch fehlgeschlagen — Retry in 15s." >&2
            sleep 15
          done
          echo "playwright install nach 3 Versuchen fehlgeschlagen." >&2
          exit 1

      - name: Production build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Start server
        # Placeholder-Supabase-URL genügt: die getestete Suite läuft
        # ausdrücklich ohne Anmeldung (siehe Kommentar in
        # e2e/pflegecoach.spec.ts). requireCoachSession() behandelt jeden
        # Fehler von supabase.auth.getUser() — auch eine nicht auflösbare
        # Placeholder-Domain — als „nicht angemeldet" (401), fail-closed
        # nach lib/coach/api-auth.ts.
        # DISABLE_RATE_LIMIT_FOR_E2E: Playwright läuft ohne Reverse-Proxy
        # gegen localhost — x-forwarded-for fehlt, also landet JEDE
        # anonyme Anfrage aus JEDEM Browser-Kontext im selben
        # "ip:unknown"-Bucket (siehe lib/middleware/rate-limit.ts). Nur
        # hier gesetzt, nicht im Build-Job und nicht in Produktion.
        env:
          DISABLE_RATE_LIMIT_FOR_E2E: '1'
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/pflegecoach/start -o /dev/null \
              && curl -sf http://localhost:3000/ -o /dev/null && exit 0
            sleep 1
          done
          echo "Server kam nach 60s nicht hoch." >&2
          exit 1

      - name: Run E2E suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        # LAEUFT UEBER DAS GANZE VERZEICHNIS, NICHT UEBER EINE LISTE.
        # Bis 28.08.2026 standen hier drei Dateinamen. Die Folge: e2e/
        # auth-delete.spec.ts, e2e/register.spec.ts und e2e/booking.spec.ts
        # lagen seit Monaten im Repo und sind in CI NIE gelaufen — die
        # Completion-Matrix hat Auth/Login deshalb ausdruecklich bei
        # PROVEN_LIVE gedeckelt statt bei E2E_PROVEN. Eine Allowlist ist
        # genau die Sorte Konfiguration, die beim naechsten neuen Spec
        # wieder vergessen wird; deshalb steht hier jetzt keine mehr.
        #
        # Was die Suite abdeckt:
        #   pflegecoach.spec.ts       DiPA QS-05
        #   pflegecoach-axe.spec.ts   DiPA BF-03 — axe-core WCAG 2.1 A/AA
        #                             plus eigener Kontrastrechner (axe
        #                             meldete den 1:1-Kontrast des primaeren
        #                             Link-Buttons am 14.08.2026 nur als
        #                             "incomplete", nicht als Verstoss)
        #   landing-axe.spec.ts       BITV B-13 — oeffentliche Hauptseiten
        #                             und als einziger Lauf ueberhaupt das
        #                             Fokus-Verhalten eines echten,
        #                             geoeffneten Dialogs
        #   auth-delete.spec.ts       AUTH-003 — unauth DELETE gibt 401;
        #                             die drei Tests mit Anmeldung
        #                             ueberspringen sich selbst, solange
        #                             PLAYWRIGHT_TEST_EMAIL/-PASSWORD
        #                             nicht gesetzt sind
        #   register.spec.ts          AUTH-011 — schwaches Passwort wird
        #                             clientseitig abgewiesen, bevor
        #                             ueberhaupt ein signUp rausgeht
        #   booking.spec.ts           AUTH-005 + Zugangsriegel auf
        #                             /kunde/buchen/*
        #   cookie-consent.spec.ts    DSGVO Art. 6/7 — Erscheinen, beide
        #                             Antwortwege, Fortbestand ueber den
        #                             Reload, Widerruf ueber den Footer,
        #                             eigener axe-Durchgang. Seit 29.08.2026:
        #                             die uebrigen Specs beantworten den
        #                             Banner vorweg (e2e/helpers/consent.ts),
        #                             weil er auf mobile-safari die
        #                             Absende-Knoepfe verdeckte. Damit er
        #                             dabei nicht ungeprueft aus der Suite
        #                             faellt, ist er hier Gegenstand statt
        #                             wie vorher zufaelliger Beifang der
        #                             axe-Laeufe.
        #
        # Kein Spec braucht ein erreichbares Supabase: die Platzhalter-URL
        # am Workflow-Kopf loest nicht auf, und genau dieser Fall ist in
        # jedem der drei neu aufgenommenen Specs der gepruefte Pfad
        # (fail-closed 401 bzw. clientseitige Validierung vor dem Netz).
        run: npx playwright test

      - name: Flackerbericht (warn-only — blockiert nicht)
        # `retries: 2` faengt Infrastruktur-Aussetzer ab und faerbt dabei
        # auch echte Fehler gruen, die im zweiten Versuch zufaellig
        # durchkommen. Am 28.08.2026 (Lauf 33221611581) stand genau so ein
        # Befund als „1 flaky" zwischen 133 gruenen Haken und ist
        # untergegangen — es war der Cookie-Banner, der auf mobile-safari
        # den Absende-Knopf der Registrierung vollstaendig verdeckte.
        #
        # Der Schritt hebt Flackerer in die Job-Zusammenfassung, blockiert
        # aber bewusst nicht (Begruendung im Skriptkopf). `if: always()`,
        # weil er gerade dann interessant ist, wenn der Lauf rot war.
        if: always()
        run: node scripts/e2e-flake-report.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
