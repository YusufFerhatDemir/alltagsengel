# ChairMatch Landing — GitHub Pages Deployment
# Deployt chairmatch-landing/ als statische Seite auf GitHub Pages.
name: Deploy ChairMatch Landing

on:
  push:
    branches: [main]
    paths:
      - 'chairmatch-landing/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chairmatch-landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
