<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark app-icon background with rounded corners -->
  <rect width="1000" height="1000" rx="200" fill="#0D0B08"/>
  <rect x="4" y="4" width="992" height="992" rx="198" stroke="url(#borderGold)" stroke-width="3" fill="none" opacity="0.3"/>

  <defs>
    <linearGradient id="carGold" x1="250" y1="300" x2="750" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="25%" stop-color="#F0D060"/>
      <stop offset="50%" stop-color="#D4A840"/>
      <stop offset="75%" stop-color="#C9963C"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <linearGradient id="carLight" x1="350" y1="300" x2="650" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C9963C"/>
    </linearGradient>
    <linearGradient id="wingGold" x1="80" y1="350" x2="920" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="30%" stop-color="#E8C850"/>
      <stop offset="60%" stop-color="#D4A840"/>
      <stop offset="100%" stop-color="#B8882E"/>
    </linearGradient>
    <linearGradient id="glassGold" x1="380" y1="350" x2="620" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8C0"/>
      <stop offset="100%" stop-color="#E8C850"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E064"/>
      <stop offset="100%" stop-color="#B8882E"/>
    </linearGradient>
    <linearGradient id="borderGold" x1="0" y1="0" x2="1000" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Wing -->
  <path d="M260 430
           C220 380, 120 310, 70 330
           C30 345, 25 385, 50 415
           C75 445, 130 450, 180 440
           C220 425, 250 440, 270 460Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M240 460
           C200 425, 110 375, 75 390
           C48 400, 45 428, 68 448
           C90 465, 140 468, 195 458
           C230 448, 240 458, 250 470Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Right Wing -->
  <path d="M740 430
           C780 380, 880 310, 930 330
           C970 345, 975 385, 950 415
           C925 445, 870 450, 820 440
           C780 425, 750 440, 730 460Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M760 460
           C800 425, 890 375, 925 390
           C952 400, 955 428, 932 448
           C910 465, 860 468, 805 458
           C770 448, 760 458, 750 470Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Car body -->
  <path d="M220 530
           L220 640
           C220 660, 235 670, 255 670
           L745 670
           C765 670, 780 660, 780 640
           L780 530
           C780 510, 765 500, 745 500
           L660 500
           L610 400
           C600 382, 580 370, 560 370
           L440 370
           C420 370, 400 382, 390 400
           L340 500
           L255 500
           C235 500, 220 510, 220 530Z"
        fill="url(#carGold)" filter="url(#glow)"/>

  <!-- Windshield -->
  <path d="M358 500 L405 400 C412 388 425 382 440 382 L490 382 L490 500Z"
        fill="url(#glassGold)" opacity="0.45"/>

  <!-- Side window -->
  <path d="M510 382 L560 382 C575 382 588 388 595 400 L642 500 L510 500Z"
        fill="url(#glassGold)" opacity="0.45"/>

  <!-- Small angel emblem on hood -->
  <g transform="translate(500, 440)" opacity="0.6">
    <circle cx="0" cy="-15" r="8" fill="url(#carLight)"/>
    <path d="M0 -7 C-8 -7 -14 0 -14 8 L-10 22 C-8 25 -4 26 0 26 C4 26 8 25 10 22 L14 8 C14 0 8 -7 0 -7Z" fill="url(#carLight)"/>
    <path d="M-14 3 C-22 -3 -28 2 -24 10 C-22 14 -18 15 -14 13Z" fill="url(#carLight)"/>
    <path d="M14 3 C22 -3 28 2 24 10 C22 14 18 15 14 13Z" fill="url(#carLight)"/>
    <ellipse cx="0" cy="-22" rx="10" ry="3" stroke="url(#carLight)" stroke-width="2" fill="none"/>
  </g>

  <!-- Headlights -->
  <ellipse cx="240" cy="550" rx="12" ry="20" fill="#F8E878" opacity="0.8"/>
  <ellipse cx="760" cy="550" rx="12" ry="20" fill="#F8E878" opacity="0.8"/>

  <!-- Left wheel -->
  <circle cx="350" cy="680" r="55" fill="#0D0B08" stroke="url(#wheelGrad)" stroke-width="8"/>
  <circle cx="350" cy="680" r="22" fill="url(#wheelGrad)" opacity="0.6"/>

  <!-- Right wheel -->
  <circle cx="650" cy="680" r="55" fill="#0D0B08" stroke="url(#wheelGrad)" stroke-width="8"/>
  <circle cx="650" cy="680" r="22" fill="url(#wheelGrad)" opacity="0.6"/>

  <!-- Bottom glow / reflection -->
  <ellipse cx="500" cy="760" rx="250" ry="8" fill="url(#carLight)" opacity="0.15"/>
  <line x1="250" y1="820" x2="750" y2="820" stroke="url(#carLight)" stroke-width="3" opacity="0.3"/>
</svg>