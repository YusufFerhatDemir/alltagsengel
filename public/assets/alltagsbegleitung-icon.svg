<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark app-icon background with rounded corners -->
  <rect width="1000" height="1000" rx="200" fill="#0D0B08"/>
  <rect x="4" y="4" width="992" height="992" rx="198" stroke="url(#borderGold)" stroke-width="3" fill="none" opacity="0.3"/>

  <defs>
    <linearGradient id="mainGold" x1="300" y1="150" x2="700" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="20%" stop-color="#F0D060"/>
      <stop offset="45%" stop-color="#D4A840"/>
      <stop offset="70%" stop-color="#C9963C"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <linearGradient id="lightGold" x1="400" y1="100" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C9963C"/>
    </linearGradient>
    <linearGradient id="heartGold" x1="420" y1="500" x2="580" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="50%" stop-color="#E8C850"/>
      <stop offset="100%" stop-color="#C9963C"/>
    </linearGradient>
    <linearGradient id="wingGold" x1="100" y1="300" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="30%" stop-color="#E8C850"/>
      <stop offset="60%" stop-color="#D4A840"/>
      <stop offset="100%" stop-color="#B8882E"/>
    </linearGradient>
    <linearGradient id="borderGold" x1="0" y1="0" x2="1000" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Halo / Heiligenschein -->
  <ellipse cx="500" cy="195" rx="70" ry="18" stroke="url(#lightGold)" stroke-width="8" fill="none" filter="url(#glow)" opacity="0.9"/>

  <!-- Head -->
  <circle cx="500" cy="260" r="65" fill="url(#lightGold)" filter="url(#glow)"/>

  <!-- Left Wing -->
  <path d="M340 380
           C300 340, 200 280, 140 300
           C100 310, 80 350, 100 380
           C120 410, 160 420, 200 410
           C220 390, 260 400, 300 420
           L340 440Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M320 410
           C280 380, 180 330, 130 345
           C100 355, 95 380, 115 400
           C135 420, 180 425, 220 415
           C260 400, 290 415, 320 430Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Right Wing -->
  <path d="M660 380
           C700 340, 800 280, 860 300
           C900 310, 920 350, 900 380
           C880 410, 840 420, 800 410
           C780 390, 740 400, 700 420
           L660 440Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M680 410
           C720 380, 820 330, 870 345
           C900 355, 905 380, 885 400
           C865 420, 820 425, 780 415
           C740 400, 710 415, 680 430Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Body / Robe -->
  <path d="M500 325
           C445 325, 390 360, 370 410
           L340 540
           L360 540
           L380 680
           C385 710, 410 730, 440 730
           L560 730
           C590 730, 615 710, 620 680
           L640 540
           L660 540
           L630 410
           C610 360, 555 325, 500 325Z"
        fill="url(#mainGold)" filter="url(#glow)"/>

  <!-- Hands holding heart -->
  <path d="M370 480
           C350 470, 330 475, 340 500
           C345 515, 370 540, 410 560
           L430 550Z"
        fill="url(#mainGold)"/>
  <path d="M630 480
           C650 470, 670 475, 660 500
           C655 515, 630 540, 590 560
           L570 550Z"
        fill="url(#mainGold)"/>

  <!-- Heart in hands -->
  <path d="M500 530
           C500 530, 460 490, 440 490
           C415 490, 400 510, 400 530
           C400 565, 435 595, 500 640
           C565 595, 600 565, 600 530
           C600 510, 585 490, 560 490
           C540 490, 500 530, 500 530Z"
        fill="url(#heartGold)" filter="url(#glow)"/>

  <!-- Bottom glow line -->
  <line x1="300" y1="820" x2="700" y2="820" stroke="url(#lightGold)" stroke-width="3" opacity="0.4"/>
  <ellipse cx="500" cy="820" rx="150" ry="5" fill="url(#lightGold)" opacity="0.2"/>
</svg>