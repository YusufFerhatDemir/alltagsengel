<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark app-icon background with rounded corners -->
  <rect width="1000" height="1000" rx="200" fill="#0D0B08"/>
  <rect x="4" y="4" width="992" height="992" rx="198" stroke="url(#borderGold)" stroke-width="3" fill="none" opacity="0.3"/>

  <defs>
    <linearGradient id="boxGold" x1="300" y1="300" x2="700" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="25%" stop-color="#F0D060"/>
      <stop offset="50%" stop-color="#D4A840"/>
      <stop offset="75%" stop-color="#C9963C"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <linearGradient id="boxLight" x1="350" y1="350" x2="500" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C9963C"/>
    </linearGradient>
    <linearGradient id="boxDark" x1="500" y1="350" x2="700" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A840"/>
      <stop offset="50%" stop-color="#B8882E"/>
      <stop offset="100%" stop-color="#8A6A20"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="400" y1="280" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="100%" stop-color="#D4A840"/>
    </linearGradient>
    <linearGradient id="wingGold" x1="100" y1="350" x2="900" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="30%" stop-color="#E8C850"/>
      <stop offset="60%" stop-color="#D4A840"/>
      <stop offset="100%" stop-color="#B8882E"/>
    </linearGradient>
    <linearGradient id="borderGold" x1="0" y1="0" x2="1000" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8E878"/>
      <stop offset="100%" stop-color="#A07428"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Wing -->
  <path d="M310 450
           C260 400, 160 340, 100 360
           C60 375, 50 410, 70 440
           C90 470, 140 475, 190 465
           C230 450, 270 460, 310 480Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M290 475
           C250 440, 150 390, 110 405
           C80 415, 75 440, 95 460
           C115 478, 160 480, 210 470
           C250 458, 275 470, 295 485Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Right Wing -->
  <path d="M690 450
           C740 400, 840 340, 900 360
           C940 375, 950 410, 930 440
           C910 470, 860 475, 810 465
           C770 450, 730 460, 690 480Z"
        fill="url(#wingGold)" filter="url(#softGlow)" opacity="0.85"/>
  <path d="M710 475
           C750 440, 850 390, 890 405
           C920 415, 925 440, 905 460
           C885 478, 840 480, 790 470
           C750 458, 725 470, 705 485Z"
        fill="url(#wingGold)" opacity="0.5"/>

  <!-- Box body - front face (lighter) -->
  <path d="M310 430 L500 380 L500 700 L310 700Z"
        fill="url(#boxLight)" filter="url(#glow)"/>

  <!-- Box body - side face (darker) -->
  <path d="M500 380 L690 430 L690 700 L500 700Z"
        fill="url(#boxDark)" filter="url(#glow)"/>

  <!-- Box bottom -->
  <path d="M310 700 L500 740 L690 700 L500 700Z"
        fill="#8A6A20"/>

  <!-- Box lid - front -->
  <path d="M290 430 L500 370 L500 410 L290 470Z"
        fill="url(#ribbonGold)"/>

  <!-- Box lid - side -->
  <path d="M500 370 L710 430 L710 470 L500 410Z"
        fill="url(#boxGold)"/>

  <!-- Ribbon vertical - front -->
  <rect x="470" y="430" width="30" height="270" fill="url(#ribbonGold)" opacity="0.6"/>

  <!-- Ribbon horizontal band -->
  <path d="M310 540 L500 500 L690 540 L690 570 L500 530 L310 570Z"
        fill="url(#ribbonGold)" opacity="0.5"/>

  <!-- Bow - left loop -->
  <path d="M500 350
           C480 320, 420 280, 390 300
           C370 315, 380 345, 410 355
           C435 362, 470 355, 500 350Z"
        fill="url(#ribbonGold)" filter="url(#glow)"/>

  <!-- Bow - right loop -->
  <path d="M500 350
           C520 320, 580 280, 610 300
           C630 315, 620 345, 590 355
           C565 362, 530 355, 500 350Z"
        fill="url(#ribbonGold)" filter="url(#glow)"/>

  <!-- Bow center knot -->
  <circle cx="500" cy="355" r="15" fill="url(#ribbonGold)"/>

  <!-- Small angel emblem on box -->
  <g transform="translate(500, 600)" opacity="0.4">
    <circle cx="0" cy="-30" r="12" fill="url(#ribbonGold)"/>
    <path d="M0 -18 C-15 -18 -25 -5 -25 10 L-20 35 C-18 40 -10 42 0 42 C10 42 18 40 20 35 L25 10 C25 -5 15 -18 0 -18Z" fill="url(#ribbonGold)"/>
    <path d="M-25 5 C-35 -5 -45 0 -40 12 C-37 18 -30 20 -25 18Z" fill="url(#ribbonGold)"/>
    <path d="M25 5 C35 -5 45 0 40 12 C37 18 30 20 25 18Z" fill="url(#ribbonGold)"/>
  </g>

  <!-- Bottom glow line -->
  <line x1="300" y1="820" x2="700" y2="820" stroke="url(#boxLight)" stroke-width="3" opacity="0.4"/>
  <ellipse cx="500" cy="820" rx="150" ry="5" fill="url(#boxLight)" opacity="0.2"/>
</svg>