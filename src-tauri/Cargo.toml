# Alltagsengel Desktop — Tauri v2 (Rust-Backend)
# Build-Voraussetzungen siehe /DESKTOP_BUILD.md (Rust, Cargo, Tauri CLI).

[package]
name = "alltagsengel-desktop"
version = "1.0.0"
description = "Alltagsengel — Pflege & Betreuung (Desktop-App)"
authors = ["Alltagsengel UG"]
edition = "2021"
rust-version = "1.77.2"

# Die Library wird von Tauri v2 für Desktop UND (später) Mobile geteilt.
[lib]
name = "alltagsengel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Öffnet externe Links (Impressum, Mailto, Telefon) im System-Browser
# statt im App-Webview.
tauri-plugin-opener = "2"

[profile.release]
# Kleinere Binaries für die Auslieferung (Updater/Downloads).
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
