<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>efy care – Facebook Event Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1005px;
    overflow: hidden;
    font-family: 'Inter', 'Manrope', sans-serif;
  }

  .event {
    position: relative;
    width: 1920px;
    height: 1005px;
    background: #2D3135;
    overflow: hidden;
  }

  /* Subtle gradient overlays */
  .event::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(15,94,87,0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 70%, rgba(45,122,99,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(45,49,53,0.5) 0%, transparent 80%);
    z-index: 1;
  }

  /* Large organic circle shapes */
  .circle-1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(216,194,157,0.06);
    top: -150px;
    right: -100px;
    z-index: 2;
  }

  .circle-2 {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    border: 1px solid rgba(169,203,181,0.05);
    top: -75px;
    right: -25px;
    z-index: 2;
  }

  .circle-3 {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    border: 1px solid rgba(15,94,87,0.08);
    bottom: -100px;
    left: -50px;
    z-index: 2;
  }

  /* Geometric thin lines */
  .geo-line-h {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(216,194,157,0.15), transparent);
    z-index: 2;
  }

  .geo-line-h.top {
    top: 180px;
    left: 120px;
    width: 300px;
  }

  .geo-line-h.bottom {
    bottom: 180px;
    right: 120px;
    width: 400px;
  }

  .geo-line-v {
    position: absolute;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(216,194,157,0.12), transparent);
    z-index: 2;
  }

  .geo-line-v.left {
    left: 120px;
    top: 180px;
    height: 200px;
  }

  .geo-line-v.right {
    right: 120px;
    bottom: 180px;
    height: 250px;
  }

  /* Diamond accent */
  .diamond {
    position: absolute;
    width: 12px;
    height: 12px;
    background: rgba(216,194,157,0.2);
    transform: rotate(45deg);
    z-index: 3;
  }

  .diamond.tl {
    top: 175px;
    left: 115px;
  }

  .diamond.br {
    bottom: 175px;
    right: 115px;
  }

  /* Small decorative dots pattern */
  .dot-grid {
    position: absolute;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(5, 4px);
    gap: 12px;
  }

  .dot-grid.top-right {
    top: 100px;
    right: 200px;
  }

  .dot-grid.bottom-left {
    bottom: 120px;
    left: 200px;
  }

  .dot-grid span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(216,194,157,0.1);
  }

  .dot-grid span:nth-child(odd) {
    background: rgba(169,203,181,0.08);
  }

  /* Emerald accent bar */
  .emerald-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, #0F5E57 0%, #2D7A63 50%, #A9CBB5 100%);
    z-index: 3;
  }

  /* Main content container */
  .main-content {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 200px;
  }

  /* Logo at top */
  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 60px;
  }

  .logo-efy {
    color: #A9CBB5;
  }

  .logo-heart {
    color: #D8C29D;
    font-size: 18px;
    margin: 0 2px;
    position: relative;
    top: -1px;
  }

  .logo-care {
    color: #2D7A63;
  }

  /* Decorative separator above title */
  .separator-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }

  .sep-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #D8C29D);
  }

  .sep-line.right {
    background: linear-gradient(90deg, #D8C29D, transparent);
  }

  .sep-icon {
    color: #D8C29D;
    font-size: 14px;
    opacity: 0.6;
  }

  /* Subtitle label */
  .event-label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: #D8C29D;
    text-transform: uppercase;
    letter-spacing: 5px;
    margin-bottom: 24px;
  }

  /* Event title */
  .event-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 72px;
    color: #F8F6F2;
    line-height: 1.15;
    margin-bottom: 40px;
    letter-spacing: -1px;
    max-width: 1100px;
  }

  /* Separator below title */
  .separator-bottom {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, #0F5E57, #D8C29D);
    border-radius: 1px;
    margin-bottom: 40px;
  }

  /* Event details */
  .event-details {
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .detail-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .detail-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(216,194,157,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .detail-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: #D8C29D;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .detail-text {
    text-align: left;
  }

  .detail-label {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: rgba(248,246,242,0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .detail-value {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: #F8F6F2;
    letter-spacing: 0.3px;
  }

  /* Divider between details */
  .detail-divider {
    width: 1px;
    height: 40px;
    background: linear-gradient(180deg, transparent, rgba(216,194,157,0.2), transparent);
  }

  /* Bottom tagline */
  .tagline {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 16px;
    color: rgba(248,246,242,0.35);
    letter-spacing: 3px;
  }

  /* Wave decoration top */
  .wave-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 2;
  }

  .wave-top svg {
    width: 100%;
    height: 40px;
    display: block;
  }
</style>
</head>
<body>
<div class="event">
  <!-- Decorative elements -->
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>

  <div class="geo-line-h top"></div>
  <div class="geo-line-h bottom"></div>
  <div class="geo-line-v left"></div>
  <div class="geo-line-v right"></div>

  <div class="diamond tl"></div>
  <div class="diamond br"></div>

  <div class="emerald-bar"></div>

  <div class="dot-grid top-right">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="dot-grid bottom-left">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="logo">
      <span class="logo-efy">efy</span>
      <span class="logo-heart">&#9829;</span>
      <span class="logo-care">care</span>
    </div>

    <div class="separator-top">
      <span class="sep-line"></span>
      <span class="sep-icon">&#9830;</span>
      <span class="sep-line right"></span>
    </div>

    <div class="event-label">Veranstaltung</div>

    <h1 class="event-title">Veranstaltungsname</h1>

    <div class="separator-bottom"></div>

    <div class="event-details">
      <div class="detail-item">
        <div class="detail-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="detail-text">
          <div class="detail-label">Datum &amp; Uhrzeit</div>
          <div class="detail-value">DD. Monat YYYY | HH:MM Uhr</div>
        </div>
      </div>

      <div class="detail-divider"></div>

      <div class="detail-item">
        <div class="detail-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="detail-text">
          <div class="detail-label">Ort</div>
          <div class="detail-value">Veranstaltungsort</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom tagline -->
  <div class="tagline">Mit Herz. F&uuml;r Menschen.</div>
</div>
</body>
</html>
