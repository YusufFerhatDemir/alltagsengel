<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>efy care – Facebook Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', 'Manrope', sans-serif;
  }

  .post {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #F8F6F2;
    overflow: hidden;
  }

  /* Subtle background pattern */
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 95% 5%, rgba(169,203,181,0.15) 0%, transparent 40%),
      radial-gradient(circle at 5% 95%, rgba(15,94,87,0.05) 0%, transparent 40%);
    z-index: 1;
  }

  /* Image placeholder area - top section */
  .image-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 310px;
    background: linear-gradient(135deg, #0F5E57 0%, #2D7A63 50%, #A9CBB5 100%);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Organic decorative shapes in image area */
  .image-area::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(248,246,242,0.06) 0%, transparent 70%);
    top: -100px;
    right: -80px;
  }

  .image-area::after {
    content: '';
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,194,157,0.08) 0%, transparent 70%);
    bottom: -60px;
    left: 100px;
  }

  .image-placeholder {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .image-icon {
    width: 64px;
    height: 64px;
    border: 2px dashed rgba(248,246,242,0.3);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-icon svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: rgba(248,246,242,0.4);
    stroke-width: 1.5;
  }

  .image-label {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: rgba(248,246,242,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Bottom curved edge on image area */
  .image-curve {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    z-index: 3;
  }

  .image-curve svg {
    width: 100%;
    height: 30px;
    display: block;
  }

  /* Content area */
  .content {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1200px;
    height: 320px;
    padding: 40px 60px 30px;
    z-index: 2;
    display: flex;
    flex-direction: column;
  }

  /* Accent bar */
  .accent-bar {
    width: 48px;
    height: 3px;
    background: linear-gradient(90deg, #0F5E57, #D8C29D);
    border-radius: 2px;
    margin-bottom: 20px;
  }

  .headline {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 36px;
    color: #2D3135;
    line-height: 1.25;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  .body-text {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 17px;
    color: rgba(45,49,53,0.7);
    line-height: 1.65;
    max-width: 750px;
    flex: 1;
  }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: auto;
  }

  /* Logo */
  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: baseline;
    gap: 3px;
  }

  .logo-efy {
    color: #0F5E57;
  }

  .logo-heart {
    color: #D8C29D;
    font-size: 16px;
    margin: 0 1px;
    position: relative;
    top: -1px;
  }

  .logo-care {
    color: #2D7A63;
  }

  .website {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: rgba(45,49,53,0.45);
    letter-spacing: 0.5px;
  }

  /* Decorative corner element */
  .corner-deco {
    position: absolute;
    bottom: 80px;
    right: 60px;
    z-index: 2;
  }

  .corner-deco .ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1.5px solid rgba(15,94,87,0.08);
    position: absolute;
  }

  .corner-deco .ring:nth-child(2) {
    width: 56px;
    height: 56px;
    top: 12px;
    left: 12px;
    border-color: rgba(169,203,181,0.12);
  }

  /* Thin vertical line accent */
  .line-accent {
    position: absolute;
    right: 40px;
    top: 340px;
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, transparent, rgba(15,94,87,0.12), transparent);
    z-index: 2;
  }
</style>
</head>
<body>
<div class="post">
  <!-- Image area (top half) -->
  <div class="image-area">
    <div class="image-placeholder">
      <div class="image-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </div>
      <span class="image-label">Bild hier einf&uuml;gen</span>
    </div>
    <div class="image-curve">
      <svg viewBox="0 0 1200 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,0 C300,30 900,30 1200,0 L1200,30 L0,30 Z" fill="#F8F6F2"/>
      </svg>
    </div>
  </div>

  <!-- Content area (bottom half) -->
  <div class="content">
    <div class="accent-bar"></div>
    <h1 class="headline">Titel des Beitrags</h1>
    <p class="body-text">
      Hier steht der Beschreibungstext des Beitrags. Dieser Platzhalter kann
      durch Ihren individuellen Inhalt ersetzt werden. Nutzen Sie diesen
      Bereich f&uuml;r wichtige Informationen und Botschaften.
    </p>
    <div class="bottom-bar">
      <div class="logo">
        <span class="logo-efy">efy</span>
        <span class="logo-heart">&#9829;</span>
        <span class="logo-care">care</span>
      </div>
      <span class="website">www.efycare.de</span>
    </div>
  </div>

  <!-- Decorative elements -->
  <div class="corner-deco">
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <div class="line-accent"></div>
</div>
</body>
</html>
