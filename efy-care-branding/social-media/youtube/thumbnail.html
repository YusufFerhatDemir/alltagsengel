<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>efy care - YouTube Thumbnail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #2D3135;
      position: relative;
    }

    .canvas {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }

    /* ===== DIAGONAL GEOMETRIC ACCENT ===== */
    .diagonal-accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    .diagonal-accent::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 900px;
      height: 1100px;
      background: linear-gradient(145deg, #0F5E57 0%, #0D524C 40%, #0A4640 100%);
      transform: rotate(-12deg);
      transform-origin: top right;
      border-radius: 0 0 0 80px;
    }
    .diagonal-accent::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 860px;
      height: 1060px;
      background: linear-gradient(145deg, rgba(45, 122, 99, 0.25) 0%, rgba(15, 94, 87, 0.1) 100%);
      transform: rotate(-12deg);
      transform-origin: top right;
      border-radius: 0 0 0 80px;
    }

    /* Secondary geometric strip */
    .geo-strip {
      position: absolute;
      top: 0;
      right: 340px;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, transparent 0%, #D8C29D 20%, #D8C29D 80%, transparent 100%);
      transform: rotate(-12deg);
      transform-origin: top center;
      opacity: 0.35;
      z-index: 2;
    }

    .geo-strip-thin {
      position: absolute;
      top: 0;
      right: 354px;
      width: 2px;
      height: 100%;
      background: linear-gradient(180deg, transparent 0%, #A9CBB5 20%, #A9CBB5 80%, transparent 100%);
      transform: rotate(-12deg);
      transform-origin: top center;
      opacity: 0.2;
      z-index: 2;
    }

    /* ===== SUBTLE TEXTURE OVERLAY ===== */
    .texture {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 85%, rgba(216, 194, 157, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(169, 203, 181, 0.05) 0%, transparent 40%);
      z-index: 3;
      pointer-events: none;
    }

    /* ===== DECORATIVE ELEMENTS ===== */
    .deco-dots {
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }

    .deco-dot {
      position: absolute;
      border-radius: 50%;
      background: #D8C29D;
    }
    .deco-dot-1 { top: 60px; left: 55px; width: 5px; height: 5px; opacity: 0.3; }
    .deco-dot-2 { top: 100px; left: 55px; width: 3px; height: 3px; opacity: 0.2; }
    .deco-dot-3 { top: 80px; left: 75px; width: 4px; height: 4px; opacity: 0.15; }
    .deco-dot-4 { bottom: 160px; left: 40px; width: 5px; height: 5px; opacity: 0.2; }
    .deco-dot-5 { bottom: 140px; left: 60px; width: 3px; height: 3px; opacity: 0.15; }

    /* Small cross accents */
    .cross-accent {
      position: absolute;
      width: 14px;
      height: 14px;
      z-index: 4;
      opacity: 0.2;
    }
    .cross-accent::before,
    .cross-accent::after {
      content: '';
      position: absolute;
      background: #D8C29D;
    }
    .cross-accent::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      transform: translateY(-50%);
    }
    .cross-accent::after {
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      transform: translateX(-50%);
    }
    .cross-1 { top: 150px; left: 35px; }
    .cross-2 { bottom: 200px; left: 580px; opacity: 0.1; }

    /* ===== CONTENT AREA ===== */
    .content {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      padding: 50px 60px;
    }

    /* Left side: text content */
    .text-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 680px;
      z-index: 10;
    }

    /* Category tag */
    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(216, 194, 157, 0.15);
      border: 1px solid rgba(216, 194, 157, 0.25);
      border-radius: 20px;
      padding: 6px 18px;
      margin-bottom: 24px;
      width: fit-content;
    }

    .category-tag span {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #D8C29D;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D8C29D;
    }

    /* Title */
    .title {
      margin-bottom: 20px;
      line-height: 1.05;
    }

    .title-line {
      display: block;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 72px;
      color: #F8F6F2;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
    }

    .title-line.accent {
      color: #D8C29D;
    }

    .title-line.green-accent {
      color: #A9CBB5;
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: rgba(248, 246, 242, 0.7);
      letter-spacing: 0.5px;
      line-height: 1.4;
      max-width: 500px;
    }

    /* Separator line */
    .title-separator {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #D8C29D, #A9CBB5);
      border-radius: 2px;
      margin: 18px 0;
    }

    /* ===== RIGHT SIDE: PERSON PLACEHOLDER ===== */
    .visual-side {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 8;
    }

    .person-frame {
      width: 300px;
      height: 360px;
      border-radius: 24px;
      background: linear-gradient(160deg, rgba(15, 94, 87, 0.5) 0%, rgba(45, 122, 99, 0.3) 100%);
      border: 2px solid rgba(169, 203, 181, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .person-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(45, 49, 53, 0.6) 100%);
      z-index: 1;
    }

    /* Person silhouette icon */
    .person-icon {
      z-index: 2;
      margin-bottom: 16px;
    }

    .person-icon svg {
      width: 110px;
      height: 110px;
      fill: rgba(169, 203, 181, 0.35);
    }

    .person-label {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(169, 203, 181, 0.5);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    /* Frame accent corner */
    .frame-corner {
      position: absolute;
      width: 30px;
      height: 30px;
      z-index: 3;
    }
    .frame-corner-tl {
      top: 12px;
      left: 12px;
      border-top: 2px solid #D8C29D;
      border-left: 2px solid #D8C29D;
      border-radius: 4px 0 0 0;
      opacity: 0.5;
    }
    .frame-corner-br {
      bottom: 12px;
      right: 12px;
      border-bottom: 2px solid #D8C29D;
      border-right: 2px solid #D8C29D;
      border-radius: 0 0 4px 0;
      opacity: 0.5;
    }

    /* ===== PLAY BUTTON OVERLAY ===== */
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(216, 194, 157, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      box-shadow:
        0 4px 20px rgba(216, 194, 157, 0.4),
        0 0 0 6px rgba(216, 194, 157, 0.15),
        0 0 0 14px rgba(216, 194, 157, 0.06);
    }

    .play-button svg {
      width: 26px;
      height: 26px;
      fill: #2D3135;
      margin-left: 3px;
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg, transparent 0%, rgba(45, 49, 53, 0.95) 100%);
      z-index: 12;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 60px 16px;
    }

    /* Duration badge */
    .duration-badge {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      padding: 3px 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #F8F6F2;
      letter-spacing: 0.5px;
    }

    /* ===== LOGO (bottom-right) ===== */
    .logo-badge {
      position: absolute;
      bottom: 20px;
      right: 30px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(45, 49, 53, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 8px 16px;
      border: 1px solid rgba(169, 203, 181, 0.12);
    }

    .logo-badge .logo-efy {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #F8F6F2;
    }
    .logo-badge .logo-heart {
      font-size: 12px;
      color: #D8C29D;
      margin: 0 3px;
      line-height: 1;
    }
    .logo-badge .logo-care {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #A9CBB5;
    }

    /* ===== TOP ACCENT LINE ===== */
    .top-accent-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0F5E57, #2D7A63 30%, #D8C29D 50%, #A9CBB5 70%, #0F5E57);
      z-index: 20;
    }

    /* ===== BOTTOM ACCENT LINE ===== */
    .bottom-accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #D8C29D, #A9CBB5 40%, #2D7A63 70%, #0F5E57);
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <!-- Diagonal emerald accent shape -->
    <div class="diagonal-accent"></div>
    <div class="geo-strip"></div>
    <div class="geo-strip-thin"></div>

    <!-- Subtle texture -->
    <div class="texture"></div>

    <!-- Decorative dots -->
    <div class="deco-dots">
      <div class="deco-dot deco-dot-1"></div>
      <div class="deco-dot deco-dot-2"></div>
      <div class="deco-dot deco-dot-3"></div>
      <div class="deco-dot deco-dot-4"></div>
      <div class="deco-dot deco-dot-5"></div>
    </div>

    <!-- Cross accents -->
    <div class="cross-accent cross-1"></div>
    <div class="cross-accent cross-2"></div>

    <!-- Top accent line -->
    <div class="top-accent-line"></div>

    <!-- Main content -->
    <div class="content">

      <!-- Left: Text content -->
      <div class="text-side">

        <!-- Category tag -->
        <div class="category-tag">
          <div class="tag-dot"></div>
          <span>Pflege &amp; Betreuung</span>
        </div>

        <!-- Title (3-line layout with visual hierarchy) -->
        <div class="title">
          <span class="title-line">Video</span>
          <span class="title-line accent">Titel</span>
          <span class="title-line green-accent" style="font-size: 52px; font-weight: 600;">Hier</span>
        </div>

        <!-- Separator -->
        <div class="title-separator"></div>

        <!-- Subtitle -->
        <div class="subtitle">Untertitel hier eingeben &ndash; kurze Beschreibung des Videoinhalts</div>

      </div>
    </div>

    <!-- Right: Person/Image placeholder -->
    <div class="visual-side">
      <div class="person-frame">

        <!-- Corner accents -->
        <div class="frame-corner frame-corner-tl"></div>
        <div class="frame-corner frame-corner-br"></div>

        <!-- Person icon silhouette -->
        <div class="person-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v1.2c0 .7.5 1.2 1.2 1.2h16.8c.7 0 1.2-.5 1.2-1.2v-1.2c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>

        <div class="person-label">Bild / Foto</div>

        <!-- Play button overlay -->
        <div class="play-button">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- Duration badge (bottom-left) -->
    <div class="bottom-bar">
      <div class="duration-badge">12:34</div>
    </div>

    <!-- Logo badge (bottom-right) -->
    <div class="logo-badge">
      <span class="logo-efy">efy</span>
      <span class="logo-heart">&#9829;</span>
      <span class="logo-care">care</span>
    </div>

    <!-- Bottom accent line -->
    <div class="bottom-accent-line"></div>

  </div>
</body>
</html>
