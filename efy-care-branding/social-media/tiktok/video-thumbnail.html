<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>efy care — TikTok Video Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep-emerald: #0F5E57;
    --forest-green: #2D7A63;
    --sage-green: #A9CBB5;
    --warm-ivory: #F8F6F2;
    --charcoal: #2D3135;
    --champagner: #D8C29D;
  }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Manrope', 'Inter', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: linear-gradient(175deg, var(--charcoal) 0%, #1a2e2b 35%, var(--deep-emerald) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Organic background shapes */
  .bg-shape-1 {
    position: absolute;
    top: -120px;
    right: -180px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45,122,99,0.25) 0%, transparent 70%);
  }

  .bg-shape-2 {
    position: absolute;
    bottom: 200px;
    left: -200px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,94,87,0.3) 0%, transparent 70%);
  }

  .bg-shape-3 {
    position: absolute;
    top: 40%;
    right: -100px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,194,157,0.08) 0%, transparent 70%);
  }

  /* Thin decorative lines */
  .deco-line-1 {
    position: absolute;
    top: 280px;
    left: 60px;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--champagner), transparent);
    opacity: 0.4;
  }

  .deco-line-2 {
    position: absolute;
    top: 600px;
    right: 80px;
    width: 180px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--champagner), transparent);
    opacity: 0.3;
  }

  .deco-line-3 {
    position: absolute;
    bottom: 500px;
    left: 100px;
    width: 80px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.25;
  }

  /* Dot accents */
  .dot-accent {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--champagner);
    opacity: 0.3;
  }

  .dot-1 { top: 350px; left: 90px; }
  .dot-2 { top: 520px; right: 120px; width: 4px; height: 4px; opacity: 0.2; }
  .dot-3 { bottom: 600px; left: 200px; width: 5px; height: 5px; opacity: 0.25; }

  /* Content area */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
    margin-top: -100px;
  }

  /* Champagner accent tag */
  .tag {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--champagner);
    margin-bottom: 48px;
    opacity: 0.9;
  }

  .title {
    font-family: 'Manrope', sans-serif;
    font-size: 82px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--warm-ivory);
    margin-bottom: 40px;
    letter-spacing: -1px;
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--sage-green);
    margin-bottom: 80px;
    max-width: 750px;
    opacity: 0.9;
  }

  /* Play button */
  .play-btn {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2.5px solid var(--champagner);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(216,194,157,0.08);
    backdrop-filter: blur(8px);
    position: relative;
  }

  .play-btn::before {
    content: '';
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 26px 0 26px 44px;
    border-color: transparent transparent transparent var(--champagner);
    margin-left: 8px;
  }

  .play-btn::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(216,194,157,0.2);
  }

  /* Bottom logo */
  .logo-area {
    position: absolute;
    bottom: 100px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  .logo-divider {
    width: 60px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.4;
    margin-bottom: 36px;
  }

  .logo {
    font-family: 'Manrope', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .logo .efy { color: var(--sage-green); }
  .logo .care { color: var(--forest-green); }
  .logo .heart { color: var(--champagner); font-size: 28px; margin: 0 4px; }

  .slogan {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    color: var(--champagner);
    opacity: 0.6;
    margin-top: 12px;
    letter-spacing: 2px;
    font-weight: 400;
  }

  /* Top corner accent */
  .corner-accent {
    position: absolute;
    top: 60px;
    right: 60px;
    width: 50px;
    height: 50px;
    z-index: 2;
  }

  .corner-accent::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 30px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.5;
  }

  .corner-accent::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 1px;
    height: 30px;
    background: var(--champagner);
    opacity: 0.5;
  }

  .corner-accent-bl {
    position: absolute;
    bottom: 60px;
    left: 60px;
    width: 50px;
    height: 50px;
    z-index: 2;
  }

  .corner-accent-bl::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 30px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.3;
  }

  .corner-accent-bl::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1px;
    height: 30px;
    background: var(--champagner);
    opacity: 0.3;
  }
</style>
</head>
<body>
  <div class="canvas">
    <!-- Background organic shapes -->
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>

    <!-- Decorative lines -->
    <div class="deco-line-1"></div>
    <div class="deco-line-2"></div>
    <div class="deco-line-3"></div>

    <!-- Dot accents -->
    <div class="dot-accent dot-1"></div>
    <div class="dot-accent dot-2"></div>
    <div class="dot-accent dot-3"></div>

    <!-- Corner accents -->
    <div class="corner-accent"></div>
    <div class="corner-accent-bl"></div>

    <!-- Main content -->
    <div class="content">
      <div class="tag">efy care</div>
      <h1 class="title">Video Titel hier</h1>
      <p class="subtitle">Hier kommt der Hook-Text oder eine kurze Beschreibung des Videoinhalts</p>
      <div class="play-btn"></div>
    </div>

    <!-- Bottom logo -->
    <div class="logo-area">
      <div class="logo-divider"></div>
      <div class="logo">
        <span class="efy">efy</span><span class="heart"> ♥ </span><span class="care">care</span>
      </div>
      <div class="slogan">Mit Herz. Für Menschen.</div>
    </div>
  </div>
</body>
</html>
