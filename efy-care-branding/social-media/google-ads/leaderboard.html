<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=728">
  <meta name="ad.size" content="width=728,height=90">
  <title>efy care – Leaderboard 728x90</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .ad-container {
      width: 728px;
      height: 90px;
      background-color: #0F5E57;
      border: 1px solid #2D7A63;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    /* Left: Logo */
    .ad-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      flex-shrink: 0;
      min-width: 140px;
    }

    .logo-text {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.5px;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 1px;
    }

    .logo-efy {
      color: #F8F6F2;
    }

    .logo-heart {
      color: #D8C29D;
      font-size: 14px;
      margin: 0 3px;
      position: relative;
      top: -1px;
    }

    .logo-care {
      color: #A9CBB5;
    }

    /* Vertical divider */
    .divider {
      width: 1px;
      height: 48px;
      background-color: #2D7A63;
      flex-shrink: 0;
    }

    /* Center: Copy */
    .ad-copy {
      flex: 1;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .ad-headline {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #F8F6F2;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-subline {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: #A9CBB5;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Right: CTA */
    .ad-cta-wrap {
      display: flex;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .ad-cta {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #2D3135;
      background-color: #D8C29D;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.2px;
      transition: background-color 0.2s ease, transform 0.15s ease;
      line-height: 1;
    }

    .ad-cta:hover {
      background-color: #c9b08a;
      transform: scale(1.03);
    }

    .ad-cta:active {
      transform: scale(0.98);
    }

    /* Subtle decorative accent line at top */
    .ad-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #2D7A63 0%, #A9CBB5 50%, #D8C29D 100%);
    }
  </style>
</head>
<body>
  <div class="ad-container" onclick="window.open(window.clickTag || '#', '_blank')">

    <!-- Logo -->
    <div class="ad-logo">
      <span class="logo-text">
        <span class="logo-efy">efy</span>
        <span class="logo-heart">&#9829;</span>
        <span class="logo-care">care</span>
      </span>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Copy -->
    <div class="ad-copy">
      <div class="ad-headline">Ihre Überschrift</div>
      <div class="ad-subline">Kurze Beschreibung hier</div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- CTA -->
    <div class="ad-cta-wrap">
      <button class="ad-cta">Jetzt anfragen</button>
    </div>

  </div>
</body>
</html>
