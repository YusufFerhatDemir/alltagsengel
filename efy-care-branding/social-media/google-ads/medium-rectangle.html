<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ad.size" content="width=300,height=250">
<title>efy care – Medium Rectangle (300x250)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .ad-container {
    width: 300px;
    height: 250px;
    background: #F8F6F2;
    border: 1px solid #A9CBB5;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Decorative corner accent */
  .ad-container::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #A9CBB5 0%, transparent 60%);
    border-radius: 50%;
    opacity: 0.5;
  }

  .ad-container::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: -20px;
    width: 60px;
    height: 60px;
    background: linear-gradient(315deg, #0F5E57 0%, transparent 60%);
    border-radius: 50%;
    opacity: 0.12;
  }

  /* Top section: Headline */
  .headline-section {
    padding: 20px 20px 8px 20px;
    position: relative;
    z-index: 1;
  }

  .headline-section::before {
    content: '';
    position: absolute;
    top: 16px;
    left: 20px;
    width: 32px;
    height: 3px;
    background: #D8C29D;
    border-radius: 2px;
  }

  .headline {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 22px;
    line-height: 1.15;
    color: #0F5E57;
    margin-top: 8px;
    letter-spacing: -0.3px;
  }

  /* Middle section: Content area */
  .content-section {
    flex: 1;
    padding: 6px 20px 8px 20px;
    position: relative;
    z-index: 1;
  }

  .subline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    line-height: 1.45;
    color: #2D3135;
    margin-bottom: 10px;
    opacity: 0.8;
  }

  /* Visual placeholder with icon */
  .visual-area {
    width: 100%;
    height: 68px;
    background: linear-gradient(135deg, #0F5E57 0%, #2D7A63 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .visual-area::before {
    content: '';
    position: absolute;
    top: -15px;
    right: -15px;
    width: 50px;
    height: 50px;
    border: 2px solid rgba(248, 246, 242, 0.15);
    border-radius: 50%;
  }

  .visual-area::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: -10px;
    width: 35px;
    height: 35px;
    border: 2px solid rgba(248, 246, 242, 0.1);
    border-radius: 50%;
  }

  .visual-icon {
    font-size: 28px;
    color: #F8F6F2;
    opacity: 0.9;
    position: relative;
    z-index: 1;
  }

  .visual-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #F8F6F2;
    opacity: 0.6;
    margin-left: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  /* Bottom section: CTA + Logo */
  .bottom-section {
    padding: 10px 20px 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #0F5E57;
    color: #F8F6F2;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: background 0.2s ease;
    border: none;
  }

  .cta-button:hover {
    background: #2D7A63;
  }

  /* Logo */
  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 0;
    line-height: 1;
  }

  .logo-efy {
    color: #0F5E57;
  }

  .logo-heart {
    color: #D8C29D;
    margin: 0 1px;
    font-size: 11px;
  }

  .logo-care {
    color: #2D7A63;
  }

  /* Decorative dots */
  .deco-dots {
    position: absolute;
    bottom: 48px;
    right: 16px;
    display: grid;
    grid-template-columns: repeat(3, 4px);
    gap: 4px;
    opacity: 0.2;
  }

  .deco-dots span {
    width: 4px;
    height: 4px;
    background: #0F5E57;
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="ad-container">

  <div class="headline-section">
    <h1 class="headline">Ihre Überschrift</h1>
  </div>

  <div class="content-section">
    <p class="subline">Kurze Beschreibung Ihrer Dienstleistung</p>
    <div class="visual-area">
      <span class="visual-icon">♥</span>
      <span class="visual-label">Bild / Inhalt</span>
    </div>
  </div>

  <div class="deco-dots">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <div class="bottom-section">
    <a class="cta-button" href="#">Jetzt anfragen</a>
    <div class="logo">
      <span class="logo-efy">efy</span>
      <span class="logo-heart">♥</span>
      <span class="logo-care">care</span>
    </div>
  </div>

</div>
</body>
</html>
