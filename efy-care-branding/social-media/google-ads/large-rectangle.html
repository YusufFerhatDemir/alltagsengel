<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ad.size" content="width=336,height=280">
<title>efy care – Large Rectangle (336x280)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .ad-container {
    width: 336px;
    height: 280px;
    background: #2D3135;
    border: 1px solid #0F5E57;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Geometric accent shapes */
  .geo-accent-1 {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 100px;
    height: 100px;
    background: #0F5E57;
    border-radius: 50%;
    opacity: 0.25;
  }

  .geo-accent-2 {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: #0F5E57;
    border-radius: 50%;
    opacity: 0.15;
  }

  .geo-accent-3 {
    position: absolute;
    bottom: -30px;
    left: -30px;
    width: 80px;
    height: 80px;
    border: 1.5px solid rgba(169, 203, 181, 0.15);
    border-radius: 50%;
  }

  .geo-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #0F5E57, #2D7A63, #A9CBB5);
  }

  /* Top: Visual area */
  .visual-section {
    height: 120px;
    margin: 16px 20px 0 20px;
    background: linear-gradient(135deg, #0F5E57 0%, #2D7A63 60%, #1A6B5F 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .visual-section::before {
    content: '';
    position: absolute;
    top: -20px;
    left: -20px;
    width: 70px;
    height: 70px;
    border: 1.5px solid rgba(248, 246, 242, 0.1);
    border-radius: 50%;
  }

  .visual-section::after {
    content: '';
    position: absolute;
    bottom: -15px;
    right: -15px;
    width: 50px;
    height: 50px;
    border: 1.5px solid rgba(248, 246, 242, 0.08);
    border-radius: 50%;
  }

  .visual-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .visual-heart {
    font-size: 36px;
    color: #D8C29D;
    opacity: 0.7;
    margin-bottom: 4px;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
  }

  .visual-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    color: #F8F6F2;
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Pattern dots inside visual */
  .pattern-dots {
    position: absolute;
    top: 10px;
    right: 12px;
    display: grid;
    grid-template-columns: repeat(4, 4px);
    gap: 6px;
    opacity: 0.15;
  }

  .pattern-dots span {
    width: 4px;
    height: 4px;
    background: #F8F6F2;
    border-radius: 50%;
  }

  /* Middle: Text */
  .text-section {
    padding: 12px 20px 6px 20px;
    position: relative;
    z-index: 1;
  }

  .headline {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 20px;
    line-height: 1.15;
    color: #F8F6F2;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .subline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    line-height: 1.4;
    color: #A9CBB5;
    opacity: 0.85;
  }

  /* Bottom: CTA + Logo */
  .bottom-section {
    margin-top: auto;
    padding: 10px 20px 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #D8C29D;
    color: #2D3135;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 9px 20px;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.2px;
    cursor: pointer;
    border: none;
    transition: background 0.2s ease;
  }

  .cta-button:hover {
    background: #F8F6F2;
  }

  /* Logo */
  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 0;
    line-height: 1;
  }

  .logo-efy {
    color: #F8F6F2;
  }

  .logo-heart {
    color: #D8C29D;
    margin: 0 2px;
    font-size: 11px;
  }

  .logo-care {
    color: #A9CBB5;
  }

  /* Slogan micro text */
  .slogan {
    position: absolute;
    bottom: 4px;
    right: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 7px;
    color: #D8C29D;
    opacity: 0.45;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="ad-container">

  <div class="geo-accent-1"></div>
  <div class="geo-accent-2"></div>
  <div class="geo-accent-3"></div>
  <div class="geo-line"></div>

  <div class="visual-section">
    <div class="pattern-dots">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="visual-content">
      <span class="visual-heart">♥</span>
      <span class="visual-label">Bild / Inhalt</span>
    </div>
  </div>

  <div class="text-section">
    <h1 class="headline">Ihre Überschrift</h1>
    <p class="subline">Kurze Beschreibung hier</p>
  </div>

  <div class="bottom-section">
    <a class="cta-button" href="#">Jetzt anfragen</a>
    <div class="logo">
      <span class="logo-efy">efy</span>
      <span class="logo-heart">♥</span>
      <span class="logo-care">care</span>
    </div>
  </div>

  <span class="slogan">Mit Herz. Für Menschen.</span>

</div>
</body>
</html>
