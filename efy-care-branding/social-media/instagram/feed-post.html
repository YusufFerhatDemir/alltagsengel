<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>efy care - Feed Post Template</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #0F5E57;
      position: relative;
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Background decorative elements */
    .bg-circle-1 {
      position: absolute;
      top: -120px;
      right: -80px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(168, 203, 181, 0.12);
    }
    .bg-circle-2 {
      position: absolute;
      bottom: -60px;
      left: -100px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 1px solid rgba(168, 203, 181, 0.08);
    }
    .bg-circle-3 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      border-radius: 50%;
      border: 1px solid rgba(168, 203, 181, 0.06);
    }

    .bg-line-1 {
      position: absolute;
      top: 80px;
      left: 60px;
      width: 60px;
      height: 1px;
      background: rgba(216, 194, 157, 0.3);
    }
    .bg-line-2 {
      position: absolute;
      bottom: 180px;
      right: 60px;
      width: 80px;
      height: 1px;
      background: rgba(216, 194, 157, 0.3);
    }

    .dot-accent {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(216, 194, 157, 0.4);
    }
    .dot-1 { top: 78px; left: 130px; }
    .dot-2 { bottom: 178px; right: 150px; }
    .dot-3 { top: 200px; right: 90px; width: 4px; height: 4px; }

    /* Organic shape */
    .organic-shape {
      position: absolute;
      top: 60px;
      right: 40px;
      width: 180px;
      height: 180px;
      opacity: 0.04;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 80px 80px 60px;
      width: 100%;
      height: 100%;
    }

    .top-tag {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #D8C29D;
      margin-bottom: 40px;
      margin-top: 20px;
    }

    .headline {
      font-family: 'Manrope', sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: #F8F6F2;
      line-height: 1.2;
      margin-bottom: 24px;
      max-width: 800px;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 300;
      color: #A9CBB5;
      line-height: 1.6;
      max-width: 700px;
      margin-bottom: 50px;
    }

    /* Image placeholder */
    .image-placeholder {
      width: 680px;
      height: 340px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(45, 122, 99, 0.5), rgba(169, 203, 181, 0.2));
      border: 1px solid rgba(169, 203, 181, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .image-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 40%, rgba(169, 203, 181, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(45, 122, 99, 0.2) 0%, transparent 50%);
    }

    .image-placeholder-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(248, 246, 242, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .image-placeholder-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: rgba(248, 246, 242, 0.5);
      stroke-width: 1.5;
    }

    .image-placeholder-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(248, 246, 242, 0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Thin separator */
    .separator {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D8C29D, transparent);
      margin: 40px 0 30px;
    }

    /* Logo */
    .logo {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .logo-efy { color: #A9CBB5; }
    .logo-heart {
      color: #D8C29D;
      font-size: 16px;
      margin: 0 3px;
      display: inline-flex;
      align-items: center;
    }
    .logo-care { color: #2D7A63; filter: brightness(1.4); }

    .slogan {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(248, 246, 242, 0.5);
      letter-spacing: 1.5px;
    }

    /* Bottom border accent */
    .bottom-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0F5E57, #D8C29D, #2D7A63, #0F5E57);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <!-- Background decorations -->
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-circle-3"></div>
    <div class="bg-line-1"></div>
    <div class="bg-line-2"></div>
    <div class="dot-accent dot-1"></div>
    <div class="dot-accent dot-2"></div>
    <div class="dot-accent dot-3"></div>

    <svg class="organic-shape" viewBox="0 0 200 200">
      <path d="M100,10 C140,10 180,40 185,80 C190,120 170,160 130,180 C90,200 40,180 20,140 C0,100 10,50 50,25 C70,12 85,10 100,10Z" fill="#A9CBB5"/>
    </svg>

    <!-- Content -->
    <div class="content">
      <div class="top-tag">Pflege &bull; Betreuung &bull; Herz</div>

      <h1 class="headline">Ihre Überschrift hier</h1>

      <p class="subtitle">Hier steht Ihr Untertitel oder eine kurze Beschreibung, die Ihre Botschaft vermittelt.</p>

      <div class="image-placeholder">
        <div class="image-placeholder-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <span class="image-placeholder-text">Bild hier einsetzen</span>
      </div>

      <div class="separator"></div>

      <div class="logo">
        <span class="logo-efy">efy</span>
        <span class="logo-heart">&#9829;</span>
        <span class="logo-care">care</span>
      </div>

      <div class="slogan">Mit Herz. Für Menschen.</div>
    </div>

    <div class="bottom-accent"></div>
  </div>
</body>
</html>
