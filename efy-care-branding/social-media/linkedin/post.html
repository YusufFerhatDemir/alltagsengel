<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>efy care — LinkedIn Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep-emerald: #0F5E57;
    --forest-green: #2D7A63;
    --sage-green: #A9CBB5;
    --warm-ivory: #F8F6F2;
    --charcoal: #2D3135;
    --champagner: #D8C29D;
  }

  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    font-family: 'Manrope', 'Inter', sans-serif;
  }

  .canvas {
    width: 1200px;
    height: 627px;
    position: relative;
    background: var(--warm-ivory);
    display: flex;
    overflow: hidden;
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, var(--deep-emerald) 0%, var(--forest-green) 50%, var(--sage-green) 100%);
  }

  /* Top thin line */
  .top-line {
    position: absolute;
    top: 0;
    left: 6px;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--deep-emerald), var(--forest-green), transparent);
    opacity: 0.15;
  }

  /* Bottom thin line */
  .bottom-line {
    position: absolute;
    bottom: 0;
    left: 6px;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--deep-emerald), transparent);
    opacity: 0.1;
  }

  /* Subtle background shape */
  .bg-circle {
    position: absolute;
    top: -100px;
    right: -80px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(169,203,181,0.15) 0%, transparent 70%);
  }

  .bg-circle-2 {
    position: absolute;
    bottom: -60px;
    right: 200px;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,94,87,0.05) 0%, transparent 70%);
  }

  /* Content left side */
  .content-left {
    flex: 1;
    padding: 60px 50px 60px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  /* Top label */
  .category {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--forest-green);
    opacity: 0.7;
    margin-bottom: 24px;
  }

  .headline {
    font-family: 'Manrope', sans-serif;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--charcoal);
    margin-bottom: 24px;
    letter-spacing: -0.5px;
    max-width: 520px;
  }

  .body-text {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--charcoal);
    opacity: 0.65;
    max-width: 480px;
    margin-bottom: 32px;
  }

  /* Accent divider */
  .text-divider {
    width: 50px;
    height: 2px;
    background: linear-gradient(90deg, var(--deep-emerald), var(--forest-green));
    border-radius: 1px;
    margin-bottom: 24px;
  }

  /* Bottom logo area */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-family: 'Manrope', sans-serif;
    font-size: 26px;
    font-weight: 700;
  }

  .logo .efy { color: var(--deep-emerald); }
  .logo .heart { color: var(--champagner); font-size: 20px; margin: 0 3px; }
  .logo .care { color: var(--forest-green); }

  .logo-divider {
    width: 1px;
    height: 24px;
    background: var(--sage-green);
    opacity: 0.5;
  }

  .logo-slogan {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--charcoal);
    opacity: 0.45;
    letter-spacing: 1px;
  }

  /* Right side — image/graphic placeholder */
  .content-right {
    flex: 0 0 420px;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .image-placeholder {
    width: 340px;
    height: 440px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(15,94,87,0.06) 0%, rgba(169,203,181,0.12) 100%);
    border: 1.5px dashed var(--sage-green);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative icon in placeholder */
  .placeholder-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep-emerald), var(--forest-green));
    opacity: 0.15;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .placeholder-icon::before {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--deep-emerald);
    border-radius: 4px;
    opacity: 0.6;
  }

  .placeholder-icon::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--forest-green);
    opacity: 0.4;
    top: 14px;
    left: 14px;
  }

  .placeholder-text {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--deep-emerald);
    opacity: 0.35;
    letter-spacing: 1px;
  }

  /* Subtle corner decoration on placeholder */
  .image-placeholder::before {
    content: '';
    position: absolute;
    top: 16px;
    right: 16px;
    width: 24px;
    height: 24px;
    border-top: 1.5px solid var(--sage-green);
    border-right: 1.5px solid var(--sage-green);
    border-radius: 0 8px 0 0;
    opacity: 0.4;
  }

  .image-placeholder::after {
    content: '';
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 24px;
    height: 24px;
    border-bottom: 1.5px solid var(--sage-green);
    border-left: 1.5px solid var(--sage-green);
    border-radius: 0 0 0 8px;
    opacity: 0.4;
  }

  /* Subtle dot pattern in the right area */
  .dots-deco {
    position: absolute;
    top: 30px;
    right: 30px;
    display: grid;
    grid-template-columns: repeat(3, 8px);
    gap: 10px;
    z-index: 1;
  }

  .dots-deco span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--sage-green);
    opacity: 0.25;
  }
</style>
</head>
<body>
  <div class="canvas">
    <!-- Accent elements -->
    <div class="accent-bar"></div>
    <div class="top-line"></div>
    <div class="bottom-line"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle-2"></div>

    <!-- Dot decoration -->
    <div class="dots-deco">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <!-- Left content -->
    <div class="content-left">
      <div>
        <div class="category">efy care · Beitrag</div>
        <h1 class="headline">Beitragstitel hier</h1>
        <div class="text-divider"></div>
        <p class="body-text">Hier kommt der Beschreibungstext oder eine kurze Zusammenfassung des Beitrags. Platz für zwei bis drei Zeilen.</p>
      </div>

      <div class="logo-row">
        <div class="logo">
          <span class="efy">efy</span><span class="heart"> ♥ </span><span class="care">care</span>
        </div>
        <div class="logo-divider"></div>
        <div class="logo-slogan">Mit Herz. Für Menschen.</div>
      </div>
    </div>

    <!-- Right placeholder -->
    <div class="content-right">
      <div class="image-placeholder">
        <div class="placeholder-icon"></div>
        <div class="placeholder-text">Bild / Grafik</div>
      </div>
    </div>
  </div>
</body>
</html>
