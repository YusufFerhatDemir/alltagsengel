<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1584, initial-scale=1.0">
<title>efy care — LinkedIn Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep-emerald: #0F5E57;
    --forest-green: #2D7A63;
    --sage-green: #A9CBB5;
    --warm-ivory: #F8F6F2;
    --charcoal: #2D3135;
    --champagner: #D8C29D;
  }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    font-family: 'Manrope', 'Inter', sans-serif;
  }

  .canvas {
    width: 1584px;
    height: 396px;
    position: relative;
    background: linear-gradient(105deg, var(--deep-emerald) 0%, #0d524c 30%, var(--forest-green) 70%, #358c6e 100%);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Dot pattern overlay */
  .dot-pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(216,194,157,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 1;
  }

  /* Organic shapes */
  .bg-shape-1 {
    position: absolute;
    top: -120px;
    left: 300px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(169,203,181,0.12) 0%, transparent 70%);
  }

  .bg-shape-2 {
    position: absolute;
    bottom: -150px;
    right: 200px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,94,87,0.2) 0%, transparent 70%);
  }

  .bg-shape-3 {
    position: absolute;
    top: -80px;
    right: 500px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,194,157,0.06) 0%, transparent 70%);
  }

  /* Thin decorative horizontal line across */
  .deco-line-top {
    position: absolute;
    top: 50px;
    left: 120px;
    right: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(216,194,157,0.15), rgba(216,194,157,0.08), transparent);
    z-index: 2;
  }

  .deco-line-bottom {
    position: absolute;
    bottom: 50px;
    left: 120px;
    right: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(216,194,157,0.12), rgba(216,194,157,0.06), transparent);
    z-index: 2;
  }

  /* Left section — Logo + Slogan */
  .section-left {
    position: relative;
    z-index: 3;
    padding-left: 100px;
    flex: 0 0 480px;
  }

  .logo {
    font-family: 'Manrope', sans-serif;
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .logo .efy { color: var(--warm-ivory); }
  .logo .heart { color: var(--champagner); font-size: 38px; margin: 0 5px; }
  .logo .care { color: var(--sage-green); }

  .slogan {
    font-family: 'Inter', sans-serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--champagner);
    letter-spacing: 3px;
    opacity: 0.85;
  }

  /* Vertical divider */
  .divider {
    width: 1px;
    height: 140px;
    background: linear-gradient(180deg, transparent, var(--champagner), transparent);
    opacity: 0.3;
    flex-shrink: 0;
    margin: 0 60px;
    position: relative;
    z-index: 3;
  }

  /* Center section — Keywords */
  .section-center {
    position: relative;
    z-index: 3;
    flex: 1;
    text-align: center;
  }

  .keywords {
    font-family: 'Manrope', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--warm-ivory);
    letter-spacing: 4px;
    opacity: 0.95;
  }

  .keyword-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--champagner);
    vertical-align: middle;
    margin: 0 20px;
    opacity: 0.7;
  }

  .keywords-sub {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--sage-green);
    margin-top: 14px;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* Second vertical divider */
  .divider-2 {
    width: 1px;
    height: 100px;
    background: linear-gradient(180deg, transparent, var(--champagner), transparent);
    opacity: 0.2;
    flex-shrink: 0;
    margin: 0 60px;
    position: relative;
    z-index: 3;
  }

  /* Right section — Contact */
  .section-right {
    position: relative;
    z-index: 3;
    padding-right: 100px;
    flex: 0 0 380px;
    text-align: right;
  }

  .contact-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--champagner);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .contact-url {
    font-family: 'Manrope', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--warm-ivory);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .contact-info {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--sage-green);
    opacity: 0.75;
    letter-spacing: 0.5px;
  }

  /* Corner accents */
  .corner-tl {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 4;
  }
  .corner-tl::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.35;
  }
  .corner-tl::after {
    content: '';
    position: absolute;
    width: 1px;
    height: 20px;
    background: var(--champagner);
    opacity: 0.35;
  }

  .corner-br {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 4;
  }
  .corner-br::before {
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 1px;
    background: var(--champagner);
    opacity: 0.25;
  }
  .corner-br::after {
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 1px;
    height: 20px;
    background: var(--champagner);
    opacity: 0.25;
  }
</style>
</head>
<body>
  <div class="canvas">
    <!-- Background layers -->
    <div class="dot-pattern"></div>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>
    <div class="deco-line-top"></div>
    <div class="deco-line-bottom"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <!-- Left: Logo + Slogan -->
    <div class="section-left">
      <div class="logo">
        <span class="efy">efy</span><span class="heart"> ♥ </span><span class="care">care</span>
      </div>
      <div class="slogan">Mit Herz. Für Menschen.</div>
    </div>

    <div class="divider"></div>

    <!-- Center: Keywords -->
    <div class="section-center">
      <div class="keywords">
        Pflege <span class="keyword-dot"></span> Betreuung <span class="keyword-dot"></span> Herz
      </div>
      <div class="keywords-sub">Professionelle Pflege mit Menschlichkeit</div>
    </div>

    <div class="divider-2"></div>

    <!-- Right: Contact -->
    <div class="section-right">
      <div class="contact-label">Kontakt</div>
      <div class="contact-url">www.efycare.de</div>
      <div class="contact-info">info@efycare.de</div>
    </div>
  </div>
</body>
</html>
