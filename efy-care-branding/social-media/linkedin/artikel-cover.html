<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>efy care — LinkedIn Artikel-Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep-emerald: #0F5E57;
    --forest-green: #2D7A63;
    --sage-green: #A9CBB5;
    --warm-ivory: #F8F6F2;
    --charcoal: #2D3135;
    --champagner: #D8C29D;
  }

  body {
    width: 1200px;
    height: 644px;
    overflow: hidden;
    font-family: 'Manrope', 'Inter', sans-serif;
  }

  .canvas {
    width: 1200px;
    height: 644px;
    position: relative;
    background: var(--warm-ivory);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top accent bar */
  .top-bar {
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--deep-emerald) 0%, var(--forest-green) 40%, var(--sage-green) 70%, var(--champagner) 100%);
    flex-shrink: 0;
  }

  /* Background organic shapes */
  .bg-shape-1 {
    position: absolute;
    top: -100px;
    right: -60px;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(169,203,181,0.12) 0%, transparent 70%);
  }

  .bg-shape-2 {
    position: absolute;
    bottom: -80px;
    left: -40px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,94,87,0.04) 0%, transparent 70%);
  }

  .bg-shape-3 {
    position: absolute;
    top: 200px;
    right: 300px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,194,157,0.06) 0%, transparent 70%);
  }

  /* Decorative vertical line */
  .deco-vline {
    position: absolute;
    top: 80px;
    left: 100px;
    width: 1px;
    height: 480px;
    background: linear-gradient(180deg, transparent, rgba(15,94,87,0.08), rgba(15,94,87,0.12), rgba(15,94,87,0.08), transparent);
  }

  /* Subtle horizontal lines */
  .deco-hline-1 {
    position: absolute;
    top: 180px;
    left: 130px;
    width: 940px;
    height: 1px;
    background: linear-gradient(90deg, rgba(169,203,181,0.2), rgba(169,203,181,0.06), transparent);
  }

  .deco-hline-2 {
    position: absolute;
    bottom: 130px;
    left: 130px;
    width: 600px;
    height: 1px;
    background: linear-gradient(90deg, rgba(169,203,181,0.15), transparent);
  }

  /* Content wrapper */
  .content {
    position: relative;
    z-index: 2;
    padding: 70px 120px 50px 140px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top section */
  .top-section {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .article-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--forest-green);
    opacity: 0.6;
    margin-bottom: 10px;
  }

  .logo-top {
    font-family: 'Manrope', sans-serif;
    font-size: 22px;
    font-weight: 700;
    opacity: 0.7;
  }

  .logo-top .efy { color: var(--deep-emerald); }
  .logo-top .heart { color: var(--champagner); font-size: 16px; margin: 0 3px; }
  .logo-top .care { color: var(--forest-green); }

  /* Main title area */
  .title-area {
    margin-top: 20px;
  }

  .title {
    font-family: 'Manrope', sans-serif;
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--deep-emerald);
    letter-spacing: -1px;
    max-width: 820px;
    margin-bottom: 30px;
  }

  /* Decorative accent shape next to title */
  .title-accent {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .accent-rect {
    width: 40px;
    height: 3px;
    background: linear-gradient(90deg, var(--champagner), var(--forest-green));
    border-radius: 2px;
  }

  .accent-dots {
    display: flex;
    gap: 6px;
  }

  .accent-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--sage-green);
    opacity: 0.5;
  }

  /* Author / date */
  .meta-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .meta-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--deep-emerald), var(--forest-green));
    opacity: 0.2;
    flex-shrink: 0;
  }

  .meta-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .meta-author {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--charcoal);
    opacity: 0.7;
  }

  .meta-date {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--charcoal);
    opacity: 0.4;
  }

  .meta-divider {
    width: 1px;
    height: 30px;
    background: var(--sage-green);
    opacity: 0.3;
  }

  .meta-readtime {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--forest-green);
    opacity: 0.5;
    letter-spacing: 0.5px;
  }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .bottom-slogan {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--champagner);
    letter-spacing: 2px;
    font-weight: 500;
    opacity: 0.6;
  }

  .bottom-deco {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bottom-deco-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, var(--sage-green), transparent);
    opacity: 0.3;
  }

  .bottom-deco-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--champagner);
    opacity: 0.35;
  }

  /* Right-side decorative element */
  .side-deco {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 1;
  }

  .side-deco-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, transparent, var(--sage-green), transparent);
    opacity: 0.2;
  }

  .side-deco-diamond {
    width: 10px;
    height: 10px;
    border: 1px solid var(--sage-green);
    transform: rotate(45deg);
    opacity: 0.2;
  }
</style>
</head>
<body>
  <div class="canvas">
    <!-- Top gradient bar -->
    <div class="top-bar"></div>

    <!-- Background shapes -->
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>

    <!-- Decorative lines -->
    <div class="deco-vline"></div>
    <div class="deco-hline-1"></div>
    <div class="deco-hline-2"></div>

    <!-- Side decoration -->
    <div class="side-deco">
      <div class="side-deco-line"></div>
      <div class="side-deco-diamond"></div>
      <div class="side-deco-line"></div>
    </div>

    <!-- Main content -->
    <div class="content">
      <!-- Top row -->
      <div>
        <div class="top-section">
          <div class="article-label">Artikel</div>
          <div class="logo-top">
            <span class="efy">efy</span><span class="heart"> ♥ </span><span class="care">care</span>
          </div>
        </div>

        <!-- Title -->
        <div class="title-area">
          <h1 class="title">Artikel Überschrift</h1>
          <div class="title-accent">
            <div class="accent-rect"></div>
            <div class="accent-dots">
              <span></span><span></span><span></span>
            </div>
          </div>

          <!-- Author / Date -->
          <div class="meta-row">
            <div class="meta-avatar"></div>
            <div class="meta-text">
              <div class="meta-author">Autor Name</div>
              <div class="meta-date">04. Juli 2026</div>
            </div>
            <div class="meta-divider"></div>
            <div class="meta-readtime">5 Min. Lesezeit</div>
          </div>
        </div>
      </div>

      <!-- Bottom -->
      <div class="bottom-bar">
        <div class="bottom-slogan">Mit Herz. Für Menschen.</div>
        <div class="bottom-deco">
          <div class="bottom-deco-dot"></div>
          <div class="bottom-deco-line"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
